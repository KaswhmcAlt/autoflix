<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kasen Stream</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <!-- PWA -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Kasen Stream","short_name":"Kasen","start_url":".","display":"standalone","background_color":"#0a0a0f","theme_color":"#00f5d4","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%2300f5d4%22/%3E%3Cpath d=%22M20 22h24v4H20zM20 32h24v4H20zM20 42h18v4H20z%22 fill=%22%230a0a0f%22/%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
  <meta name="theme-color" content="#00f5d4" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
    
    body {
      background: linear-gradient(180deg, #0a0a0f 0%, #050508 100%);
      color: #e0f2f5;
      font-family: 'Inter', system_ui, sans-serif;
    }
    .logo-font { font-family: 'Space Grotesk', sans-serif; }

    #siteHeader {
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(20px);
    }

    .card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 16px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.4);
      min-width: 180px;
      height: 270px;
      position: relative;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-12px) scale(1.05);
      box-shadow: 0 25px 50px -12px rgb(0 245 212 / 0.35);
    }
    .play-overlay { opacity: 0; position: absolute; inset: 0; background: rgba(10,10,15,0.65); display: flex; align-items: center; justify-content: center; z-index: 10; }
    .card:hover .play-overlay { opacity: 1; }

    .sidebar {
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(16px);
    }

    .genre-btn {
      transition: all 0.2s ease;
    }
    .genre-btn:hover {
      background-color: rgba(0, 245, 212, 0.1);
      transform: translateX(6px);
    }
  </style>
</head>
<body class="antialiased">

  <!-- HEADER -->
  <header id="siteHeader" class="fixed top-0 left-0 right-0 z-50 border-b border-white/10">
    <div class="max-w-screen-2xl mx-auto flex items-center justify-between px-8 py-4">
      <div class="flex items-center gap-x-3">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-[#00f5d4] to-cyan-400 flex items-center justify-center shadow-[0_0_20px_-3px_#00f5d4]">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132z" />
          </svg>
        </div>
        <h1 class="logo-font text-3xl font-semibold tracking-tight">kasen</h1>
      </div>

      <div class="flex-1 max-w-xl mx-8">
        <input id="searchBar" placeholder="Search titles, actors..." 
               class="w-full bg-white/10 border border-white/10 focus:border-[#00f5d4] rounded-3xl px-6 py-3 text-sm focus:outline-none">
      </div>

      <div class="flex items-center gap-x-6">
        <button onclick="showHome()" class="px-6 py-2.5 rounded-3xl hover:bg-white/10">Home</button>
        <div onclick="showProfileModal()" class="flex items-center gap-x-3 cursor-pointer">
          <div id="profileAvatar" class="w-9 h-9 rounded-2xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-2xl"></div>
          <div id="profileName" class="font-medium"></div>
        </div>
        <button onclick="toggleAuthModal()" id="authBtn" class="px-6 py-2.5 bg-white/10 hover:bg-white/20 rounded-3xl font-medium">Sign In</button>
      </div>
    </div>
  </header>

  <div class="pt-20 flex max-w-screen-2xl mx-auto gap-8 px-8">
    <!-- SIDEBAR - Rich like your screenshot -->
    <aside class="sidebar hidden lg:block w-80 rounded-3xl p-6 h-[calc(100vh-6rem)] sticky top-6 overflow-y-auto">
      <div class="mb-8">
        <div class="flex items-center gap-2 text-white/90 mb-4">
          <span class="text-xl">📺</span>
          <span class="font-semibold">TV Shows</span>
        </div>
        <button onclick="switchCategory(this)" data-path="/tv/popular" class="w-full text-left py-3 px-4 rounded-2xl hover:bg-white/10">Popular TV</button>
      </div>

      <div>
        <div class="font-semibold text-white/90 mb-4 flex items-center gap-2">
          <span>Genres</span>
        </div>
        <div class="space-y-1">
          <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=28" class="genre-btn w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10">🔥 Action</button>
          <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=12" class="genre-btn w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10">🌲 Adventure</button>
          <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=16" class="genre-btn w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10">🦸 Animation</button>
          <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=35" class="genre-btn w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10">😂 Comedy</button>
          <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=18" class="genre-btn w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10">🎭 Drama</button>
          <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=27" class="genre-btn w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10">👻 Horror</button>
          <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=878" class="genre-btn w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10">🚀 Sci-Fi</button>
          <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=53" class="genre-btn w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10">🔪 Thriller</button>
          <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=99" class="genre-btn w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10">📜 Documentaries</button>
          <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=10751" class="genre-btn w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10">👨‍👩‍👧 Family</button>
          <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=14" class="genre-btn w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 hover:bg-white/10">🧝 Fantasy</button>
        </div>
      </div>

      <div onclick="loadContinueWatching()" class="mt-10 cursor-pointer flex items-center gap-3 px-4 py-4 rounded-2xl hover:bg-white/10">
        <span class="text-xl">▶️</span>
        <span class="font-medium">Continue Watching</span>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 pb-12">
      <!-- Hero -->
      <section id="hero" class="rounded-3xl overflow-hidden mb-12 relative min-h-[520px] bg-cover bg-center" style="background-image: url('https://image.tmdb.org/t/p/original/');">
        <div class="absolute inset-0 bg-gradient-to-r from-black via-black/70 to-transparent"></div>
        <div class="relative z-10 p-12 flex flex-col justify-end h-full">
          <div id="heroBadge" class="inline-flex items-center text-xs uppercase tracking-widest bg-white/10 px-4 py-1 rounded-full w-fit mb-4"></div>
          <h1 id="heroTitle" class="text-6xl font-bold logo-font tracking-tighter mb-4"></h1>
          <p id="heroDesc" class="max-w-md text-lg mb-8"></p>
          <button onclick="playHero()" class="inline-flex items-center gap-3 bg-white text-black px-8 py-4 rounded-3xl font-semibold text-lg hover:scale-105">
            ▶ Play Now
          </button>
        </div>
      </section>

      <div id="rows" class="space-y-12"></div>
    </main>
  </div>

  <!-- PLAYER -->
  <div id="playerModal" class="hidden fixed inset-0 z-[9999] flex flex-col bg-black">
    <div class="flex justify-between items-center px-8 py-5 border-b border-white/10">
      <div>
        <div id="playingTitle" class="text-xl font-semibold"></div>
        <div id="playerSub" class="text-sm text-white/60"></div>
      </div>
      <button onclick="closePlayer()" class="text-4xl leading-none text-white/70 hover:text-white">×</button>
    </div>
    <div class="flex-1">
      <iframe id="embed_iframe" class="w-full h-full" frameborder="0" allowfullscreen allow="autoplay"></iframe>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div id="authModal" class="hidden fixed inset-0 bg-black/90 z-[10000] flex items-center justify-center">
    <div class="bg-[#0a0a0f] rounded-3xl w-full max-w-md p-10">
      <h2 id="authTitle" class="text-3xl font-semibold mb-8">Sign In</h2>
      <input id="emailInput" type="email" placeholder="Email" class="block w-full mb-4 bg-white/10 border border-white/10 rounded-2xl px-6 py-4">
      <input id="passwordInput" type="password" placeholder="Password" class="block w-full mb-8 bg-white/10 border border-white/10 rounded-2xl px-6 py-4">
      <button onclick="handleAuth()" id="authSubmitBtn" class="w-full py-4 bg-[#00f5d4] text-black rounded-2xl font-semibold text-lg">Sign In</button>
      <p class="text-center mt-6 text-sm text-white/60">No account? <span onclick="switchToSignup()" class="text-[#00f5d4] cursor-pointer">Create one</span></p>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="hidden fixed inset-0 bg-black/90 z-[10000] flex items-center justify-center">
    <div class="bg-[#0a0a0f] rounded-3xl p-8 max-w-lg w-full">
      <h2 class="text-2xl mb-6">Who's watching?</h2>
      <div id="profilesList" class="grid grid-cols-3 gap-6"></div>
      <button onclick="addNewProfile()" class="mt-8 w-full py-3 border border-dashed border-white/30 rounded-2xl text-[#00f5d4]">+ Add Profile</button>
    </div>
  </div>

  <script>
    // === YOUR FIREBASE CONFIG ===
    const firebaseConfig = {
      apiKey: "AIzaSyAJyF96lyKO4M0tl-GJQj5GV1lSBezgJiM",
      authDomain: "kasenflix.firebaseapp.com",
      projectId: "kasenflix",
      storageBucket: "kasenflix.firebasestorage.app",
      messagingSenderId: "939784452025",
      appId: "1:939784452025:web:fb48e9764df6a473786868"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // TMDB
    const TMDB_KEY = '70c6183515ac89cbab2dbdea3a6c6124';
    const TMDB_BASE = 'https://api.themoviedb.org/3';
    const IMG_BASE = 'https://image.tmdb.org/t/p/';

    let currentUser = null;
    let currentProfile = { id: 1, name: "Kasen", avatar: "👾" };
    let profiles = [
      { id: 1, name: "Kasen", avatar: "👾" },
      { id: 2, name: "Family", avatar: "👨‍👩‍👧" }
    ];

    const rowsContainer = document.getElementById('rows');

    async function fetchJson(url) {
      const res = await fetch(url);
      return res.ok ? res.json() : null;
    }

    // Load Hero
    async function loadHero() {
      const data = await fetchJson(`${TMDB_BASE}/trending/all/week?api_key=${TMDB_KEY}`);
      const item = data?.results?.[0];
      if (!item) return;

      const hero = document.getElementById('hero');
      hero.style.backgroundImage = `url(${IMG_BASE}original${item.backdrop_path})`;
      document.getElementById('heroTitle').textContent = item.title || item.name;
      document.getElementById('heroDesc').textContent = item.overview?.slice(0, 140) + '...';
      document.getElementById('heroBadge').innerHTML = `⭐ ${item.vote_average?.toFixed(1)}`;
    }

    function playHero() {
      const hero = document.getElementById('hero');
      // For demo we open first trending
      fetchJson(`${TMDB_BASE}/trending/all/week?api_key=${TMDB_KEY}`).then(d => {
        if (d?.results?.[0]) openPlayer(d.results[0].id, d.results[0].title || d.results[0].name, !!d.results[0].name);
      });
    }

    // Create rows
    async function initRows() {
      rowsContainer.innerHTML = '';
      const categories = [
        {label: "Trending Now", path: "/trending/all/week"},
        {label: "Top Rated", path: "/movie/top_rated"},
        {label: "Popular TV", path: "/tv/popular", tv: true}
      ];

      for (let cat of categories) {
        const section = document.createElement('section');
        section.className = 'space-y-4';
        section.innerHTML = `<h3 class="text-2xl font-semibold">${cat.label}</h3><div id="row-${cat.label}" class="flex gap-4 overflow-x-auto pb-6"></div>`;
        rowsContainer.appendChild(section);

        const container = document.getElementById(`row-${cat.label}`);
        const data = await fetchJson(`${TMDB_BASE}${cat.path}?api_key=${TMDB_KEY}`);
        
        data?.results?.forEach(item => {
          if (!item.poster_path) return;
          const card = document.createElement('div');
          card.className = 'card';
          card.style.backgroundImage = `url(${IMG_BASE}w342${item.poster_path})`;
          card.innerHTML = `
            <div class="play-overlay">
              <div class="w-16 h-16 bg-white/90 rounded-2xl flex items-center justify-center">
                <span class="text-4xl text-black">▶</span>
              </div>
            </div>
            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 p-4">
              <div class="font-medium">${item.title || item.name}</div>
            </div>`;
          card.onclick = () => openPlayer(item.id, item.title || item.name, !!item.name);
          container.appendChild(card);
        });
      }
    }

    // Player
    let currentPlayer = null;
    async function openPlayer(id, title, isTV) {
      currentPlayer = {id, isTV};
      document.getElementById('playingTitle').textContent = title;
      document.getElementById('playerSub').textContent = isTV ? 'TV Show' : 'Movie';
      document.getElementById('playerModal').classList.remove('hidden');
      
      const url = `https://embedmaster.link/movie/${id}`; // fallback
      document.getElementById('embed_iframe').src = url;
    }

    function closePlayer() {
      document.getElementById('playerModal').classList.add('hidden');
      document.getElementById('embed_iframe').src = '';
    }

    // Auth
    function toggleAuthModal() {
      if (currentUser) {
        auth.signOut();
        return;
      }
      document.getElementById('authModal').classList.remove('hidden');
    }

    async function handleAuth() {
      const email = document.getElementById('emailInput').value;
      const pass = document.getElementById('passwordInput').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        document.getElementById('authModal').classList.add('hidden');
      } catch (e) {
        alert(e.message);
      }
    }

    function switchToSignup() {
      alert("Sign up flow coming soon! Use any credentials for demo.");
    }

    auth.onAuthStateChanged(user => {
      currentUser = user;
      document.getElementById('authBtn').textContent = user ? 'Sign Out' : 'Sign In';
    });

    // Profile
    function showProfileModal() {
      const list = document.getElementById('profilesList');
      list.innerHTML = '';
      profiles.forEach(p => {
        const div = document.createElement('div');
        div.className = 'text-center cursor-pointer';
        div.innerHTML = `<div class="text-6xl mb-2">${p.avatar}</div><div>${p.name}</div>`;
        div.onclick = () => { currentProfile = p; updateProfileUI(); document.getElementById('profileModal').classList.add('hidden'); };
        list.appendChild(div);
      });
      document.getElementById('profileModal').classList.remove('hidden');
    }

    function addNewProfile() {
      const name = prompt("Profile name?");
      if (name) {
        profiles.push({id: Date.now(), name, avatar: "🆕"});
        showProfileModal();
      }
    }

    function updateProfileUI() {
      document.getElementById('profileName').textContent = currentProfile.name;
      document.getElementById('profileAvatar').textContent = currentProfile.avatar;
    }

    // Continue Watching (stub)
    function loadContinueWatching() {
      alert("Continue Watching will show your progress from localStorage + Firebase soon!");
    }

    function showHome() {
      initRows();
    }

    // Category switch
    window.switchCategory = function(el) {
      const path = el.dataset.path;
      rowsContainer.innerHTML = `<h2 class="text-3xl font-bold mb-6">Loading ${el.textContent.trim()}...</h2>`;
      // You can expand this to load the specific category
      initRows(); // fallback
    };

    // Init
    window.onload = () => {
      loadHero();
      initRows();
      updateProfileUI();
      console.log("%cKasen Stream with Firebase + PWA Ready!", "color:#00f5d4; font-size:14px");
    };
  </script>
</body>
</html>
