<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>Kasen Stream</title>

  <!-- PWA & iOS Optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kasen Stream">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/00f5d4/0a0a0f?text=K">
  <link rel="manifest" href='data:application/manifest+json,{"name":"Kasen Stream","short_name":"K-Stream","start_url":".","display":"standalone","background_color":"#0a0a0f","theme_color":"#00f5d4","icons":[{"src":"https://via.placeholder.com/192/00f5d4/0a0a0f?text=K","sizes":"192x192","type":"image/png"}]}'>

  <!-- Scripts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 'neon-teal': '#00f5d4', 'deep-black': '#0a0a0f' }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500&display=swap');
    body { background: #0a0a0f; color: #e0f2f5; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .logo-font { font-family: 'Space Grotesk', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .card {
      transition: all 0.3s ease;
      min-width: 140px; height: 210px;
      border-radius: 12px; background-size: cover; background-position: center;
      position: relative; flex-shrink: 0; cursor: pointer;
    }
    @media (min-width: 768px) { .card { min-width: 180px; height: 270px; } }
    .card:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(0,245,212,0.4); }
    .card-overlay {
      position: absolute; inset: 0; border-radius: 12px;
      background: linear-gradient(to top, rgba(10,10,15,0.9) 10%, transparent 60%);
      display: flex; flex-direction: column; justify-content: flex-end; padding: 12px;
    }
  </style>
</head>
<body class="antialiased select-none">

  <!-- HEADER -->
  <header class="fixed top-0 inset-x-0 z-50 bg-[#0a0a0f]/80 backdrop-blur-md border-b border-white/5">
    <div class="max-w-screen-2xl mx-auto px-4 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2" onclick="location.reload()">
        <div class="w-8 h-8 rounded-lg bg-neon-teal flex items-center justify-center text-black font-bold">K</div>
        <h1 class="logo-font text-xl hidden sm:block">KASEN <span class="text-neon-teal text-xs tracking-widest">STREAM</span></h1>
      </div>

      <div class="flex-1 max-w-md">
        <input id="searchBar" type="text" placeholder="Search..." class="w-full bg-white/5 border border-white/10 rounded-full px-4 py-1.5 text-sm focus:outline-none focus:border-neon-teal">
      </div>

      <div class="flex items-center gap-3">
        <div id="userProfile" onclick="showProfileModal()" class="hidden sm:flex items-center gap-2 cursor-pointer">
          <span id="profileAvatar" class="text-xl"></span>
          <span id="profileName" class="text-sm font-medium"></span>
        </div>
        <button id="authBtn" onclick="toggleAuthModal()" class="text-xs font-bold uppercase tracking-wider bg-white/5 px-4 py-2 rounded-full border border-white/10">Sign In</button>
      </div>
    </div>
  </header>

  <!-- MOBILE GENRE BAR (Fixes mobile visibility) -->
  <div class="lg:hidden fixed top-16 inset-x-0 z-40 bg-[#0a0a0f] border-b border-white/5 overflow-x-auto no-scrollbar flex items-center gap-4 px-4 h-12">
    <button onclick="showHome()" class="whitespace-nowrap text-xs font-bold text-neon-teal">Home</button>
    <button onclick="switchCategoryById(28)" class="whitespace-nowrap text-xs text-white/60">Action</button>
    <button onclick="switchCategoryById(35)" class="whitespace-nowrap text-xs text-white/60">Comedy</button>
    <button onclick="switchCategoryById(878)" class="whitespace-nowrap text-xs text-white/60">Sci-Fi</button>
    <button onclick="switchCategoryById(27)" class="whitespace-nowrap text-xs text-white/60">Horror</button>
    <button onclick="switchCategoryById(16)" class="whitespace-nowrap text-xs text-white/60">Animation</button>
  </div>

  <div class="pt-28 lg:pt-20 flex max-w-screen-2xl mx-auto">
    <!-- PC SIDEBAR -->
    <aside class="hidden lg:flex w-64 flex-col p-6 sticky top-20 h-[calc(100vh-5rem)] border-r border-white/5">
      <nav class="space-y-6">
        <div>
          <p class="text-[10px] uppercase tracking-[3px] text-white/40 mb-4">Browse</p>
          <div class="space-y-2">
            <button onclick="showHome()" class="flex items-center gap-3 w-full text-left px-3 py-2 rounded-xl hover:bg-white/5 text-sm">🏠 Home</button>
            <button onclick="switchCategoryById(28)" class="flex items-center gap-3 w-full text-left px-3 py-2 rounded-xl hover:bg-white/5 text-sm">🔥 Action</button>
            <button onclick="switchCategoryById(35)" class="flex items-center gap-3 w-full text-left px-3 py-2 rounded-xl hover:bg-white/5 text-sm">😂 Comedy</button>
            <button onclick="switchCategoryById(878)" class="flex items-center gap-3 w-full text-left px-3 py-2 rounded-xl hover:bg-white/5 text-sm">🚀 Sci-Fi</button>
            <button onclick="switchCategoryById(27)" class="flex items-center gap-3 w-full text-left px-3 py-2 rounded-xl hover:bg-white/5 text-sm">👻 Horror</button>
            <button onclick="switchCategoryById(10751)" class="flex items-center gap-3 w-full text-left px-3 py-2 rounded-xl hover:bg-white/5 text-sm">👪 Family</button>
          </div>
        </div>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 px-4 lg:px-8 pb-20">
      <div id="rows" class="space-y-10">
        <!-- Rows injected here -->
      </div>
    </main>
  </div>

  <!-- PLAYER MODAL -->
  <div id="playerModal" class="fixed inset-0 z-[100] bg-black hidden flex flex-col">
    <div class="h-14 flex items-center justify-between px-6 border-b border-white/5">
      <span id="playingTitle" class="font-bold truncate max-w-[70%]"></span>
      <button onclick="closePlayer()" class="text-2xl">&times;</button>
    </div>
    <iframe id="playerFrame" class="flex-1 w-full h-full" frameborder="0" allowfullscreen></iframe>
  </div>

  <!-- AUTH MODAL -->
  <div id="authModal" class="fixed inset-0 z-[200] bg-black/90 hidden flex items-center justify-center p-4">
    <div class="bg-zinc-900 w-full max-w-sm p-8 rounded-3xl border border-white/10">
      <h2 id="authTitle" class="text-2xl font-bold mb-6">Sign In</h2>
      <input id="emailIn" type="email" placeholder="Email" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl mb-3">
      <input id="passIn" type="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl mb-6">
      <button onclick="handleAuth()" class="w-full bg-neon-teal text-black font-bold p-4 rounded-xl mb-4">Continue</button>
      <p class="text-center text-xs text-white/40 cursor-pointer" onclick="toggleAuthMode()">Don't have an account? Sign Up</p>
    </div>
  </div>

  <!-- PROFILE SELECTOR MODAL -->
  <div id="profileModal" class="fixed inset-0 z-[300] bg-black hidden flex items-center justify-center">
    <div class="text-center w-full max-w-2xl px-6">
      <h2 class="text-3xl font-bold mb-10">Who's watching?</h2>
      <div id="profilesGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-8 mb-10"></div>
      <button onclick="auth.signOut(); location.reload();" class="text-white/40 text-sm hover:text-white">Sign Out</button>
    </div>
  </div>

  <script>
    /***** CONFIG *****/
    const firebaseConfig = {
      apiKey: "AIzaSyAJyF96lyKO4M0tl-GJQj5GV1lSBezgJiM",
      authDomain: "kasenflix.firebaseapp.com",
      projectId: "kasenflix",
      storageBucket: "kasenflix.firebasestorage.app",
      messagingSenderId: "939784452025",
      appId: "1:939784452025:web:fb48e9764df6a473786868"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const TMDB_KEY = '70c6183515ac89cbab2dbdea3a6c6124';
    const TMDB_BASE = 'https://api.themoviedb.org/3';
    const IMG_URL = 'https://image.tmdb.org/t/p/w342';
    const EMBED = 'https://embedmaster.link';

    let currentUser = null, currentProfile = null, isSignUp = false;

    /***** AUTH & PROFILES *****/
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('authBtn').classList.add('hidden');
        document.getElementById('userProfile').classList.remove('hidden');
        await loadProfiles();
      } else {
        showHome();
      }
    });

    async function handleAuth() {
      const email = document.getElementById('emailIn').value;
      const pass = document.getElementById('passIn').value;
      try {
        if (isSignUp) {
          const res = await auth.createUserWithEmailAndPassword(email, pass);
          await db.collection('users').doc(res.user.uid).collection('profiles').add({ name: email.split('@')[0], avatar: "👾" });
        } else {
          await auth.signInWithEmailAndPassword(email, pass);
        }
        document.getElementById('authModal').classList.add('hidden');
      } catch (e) { alert(e.message); }
    }

    async function loadProfiles() {
      const snap = await db.collection('users').doc(currentUser.uid).collection('profiles').get();
      const profiles = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      const grid = document.getElementById('profilesGrid');
      grid.innerHTML = profiles.map(p => `
        <div onclick="selectProfile('${p.id}')" class="group flex flex-col items-center gap-3 cursor-pointer">
          <div class="w-24 h-24 sm:w-32 sm:h-32 bg-zinc-800 rounded-2xl flex items-center justify-center text-5xl group-hover:ring-4 ring-neon-teal transition-all">${p.avatar}</div>
          <p class="text-white/60 group-hover:text-white font-medium">${p.name}</p>
        </div>
      `).join('') + `
        <div onclick="createNewProfile()" class="flex flex-col items-center gap-3 cursor-pointer">
          <div class="w-24 h-24 sm:w-32 sm:h-32 border-2 border-dashed border-white/10 rounded-2xl flex items-center justify-center text-4xl text-white/10">+</div>
          <p class="text-white/10">Add</p>
        </div>`;
      document.getElementById('profileModal').classList.remove('hidden');
    }

    function selectProfile(id) {
      db.collection('users').doc(currentUser.uid).collection('profiles').doc(id).get().then(doc => {
        currentProfile = { id, ...doc.data() };
        document.getElementById('profileName').textContent = currentProfile.name;
        document.getElementById('profileAvatar').textContent = currentProfile.avatar;
        document.getElementById('profileModal').classList.add('hidden');
        showHome();
      });
    }

    async function createNewProfile() {
      const name = prompt("Profile Name:");
      if (name) {
        await db.collection('users').doc(currentUser.uid).collection('profiles').add({ name, avatar: "🔥" });
        loadProfiles();
      }
    }

    /***** CORE LOGIC & PROGRESS *****/
    async function showHome() {
      const container = document.getElementById('rows');
      container.innerHTML = '';
      
      // 1. ADD CONTINUE WATCHING (Only if logged in)
      if (currentUser && currentProfile) {
        const progSnap = await db.collection('users').doc(currentUser.uid)
          .collection('profiles').doc(currentProfile.id)
          .collection('progress').orderBy('updatedAt', 'desc').limit(10).get();
        
        if (!progSnap.empty) {
          const rowId = "row-continue";
          container.insertAdjacentHTML('beforeend', `<section>
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">▶️ Continue Watching</h2>
            <div id="${rowId}" class="flex gap-4 overflow-x-auto no-scrollbar"></div>
          </section>`);
          
          progSnap.forEach(async (doc) => {
            const data = doc.data();
            const movie = await (await fetch(`${TMDB_BASE}/${data.isTV?'tv':'movie'}/${doc.id}?api_key=${TMDB_KEY}`)).json();
            addCardToRow(movie, rowId, data.isTV);
          });
        }
      }

      // 2. STANDARD ROWS
      const rows = [
        { label: "Trending Now", url: `${TMDB_BASE}/trending/all/week?api_key=${TMDB_KEY}` },
        { label: "Action Blockbusters", url: `${TMDB_BASE}/discover/movie?with_genres=28&api_key=${TMDB_KEY}` },
        { label: "Hilarious Comedies", url: `${TMDB_BASE}/discover/movie?with_genres=35&api_key=${TMDB_KEY}` }
      ];

      rows.forEach(r => {
        const id = `row-${Math.random().toString(36).substr(2,9)}`;
        container.insertAdjacentHTML('beforeend', `<section>
          <h2 class="text-lg font-bold mb-4">${r.label}</h2>
          <div id="${id}" class="flex gap-4 overflow-x-auto no-scrollbar"></div>
        </section>`);
        fetch(r.url).then(res => res.json()).then(data => {
          data.results.forEach(m => addCardToRow(m, id));
        });
      });
    }

    function addCardToRow(m, rowId, forceTV = false) {
      if (!m.poster_path) return;
      const isTV = forceTV || m.media_type === 'tv' || (!m.title && m.name);
      const card = document.createElement('div');
      card.className = "card";
      card.style.backgroundImage = `url(${IMG_URL}${m.poster_path})`;
      card.innerHTML = `<div class="card-overlay"><p class="text-xs font-bold truncate">${m.title || m.name}</p></div>`;
      card.onclick = () => openPlayer(m.id, m.title || m.name, isTV);
      document.getElementById(rowId).appendChild(card);
    }

    async function openPlayer(id, title, isTV) {
      const frame = document.getElementById('playerFrame');
      document.getElementById('playingTitle').textContent = title;
      document.getElementById('playerModal').classList.remove('hidden');
      
      let startAt = 0;
      if (currentUser && currentProfile) {
        const doc = await db.collection('users').doc(currentUser.uid).collection('profiles').doc(currentProfile.id).collection('progress').doc(id.toString()).get();
        if (doc.exists) startAt = doc.data().seconds;
      }

      frame.src = `${EMBED}/${isTV ? 'tv' : 'movie'}/${id}${isTV ? '/1/1' : ''}?autoplay=1`;
      
      // Save progress event (Manual for demo - ideally use postMessage from player)
      if (currentUser && currentProfile) {
        db.collection('users').doc(currentUser.uid).collection('profiles').doc(currentProfile.id).collection('progress').doc(id.toString()).set({
          title, isTV, seconds: 1, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      }
    }

    function closePlayer() {
      document.getElementById('playerFrame').src = '';
      document.getElementById('playerModal').classList.add('hidden');
    }

    function switchCategoryById(id) {
      const container = document.getElementById('rows');
      container.innerHTML = `<h2 class="text-xl font-bold mb-6 px-2">Category Results</h2><div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>`;
      fetch(`${TMDB_BASE}/discover/movie?with_genres=${id}&api_key=${TMDB_KEY}`).then(res => res.json()).then(data => {
        data.results.forEach(m => addCardToRow(m, 'grid'));
      });
    }

    function toggleAuthModal() { document.getElementById('authModal').classList.toggle('hidden'); }
    function toggleAuthMode() { 
      isSignUp = !isSignUp; 
      document.getElementById('authTitle').textContent = isSignUp ? "Create Account" : "Sign In";
    }

    showHome();
  </script>
</body>
</html>
