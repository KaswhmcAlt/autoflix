<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasen Stream</title>
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Kasen%20Stream%22,%22short_name%22:%22K-Stream%22,%22start_url%22:%22index.html%22,%22display%22:%22standalone%22,%22background_color%22:%22#141414%22,%22theme_color%22:%22#141414%22,%22icons%22:[{%22src%22:%22https://i.ibb.co/67wTJd9R/pngimg-com-netflix-PNG11.png%22,%22sizes%22:%22192x192%22,%22type%22:%22image/png%22}]}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .movie-card { transition: transform 0.4s; min-width: 160px; height: 240px; border-radius: 4px; cursor: pointer; background-size: cover; background-position: center; }
        .movie-card:hover { transform: scale(1.15); z-index: 50; }
        .row-container { display: flex; overflow-x: scroll; gap: 10px; padding: 20px 0; }
        #navbar.scrolled { background-color: #141414; }
    </style>
</head>
<body class="bg-[#141414] text-white font-sans">

    <!-- Netflix Style Navbar -->
    <nav id="navbar" class="fixed top-0 w-full z-[100] transition-all p-4 flex justify-between items-center bg-gradient-to-b from-black/90 to-transparent">
        <div class="flex items-center gap-6">
            <img src="https://i.ibb.co/67wTJd9R/pngimg-com-netflix-PNG11.png" class="h-6 md:h-8" alt="Netflix Logo">
            <div class="hidden md:flex gap-4 text-sm">
                <a href="#" class="hover:text-gray-300">Home</a>
                <a href="#tv-row" class="hover:text-gray-300">TV Shows</a>
                <a href="#movies-row" class="hover:text-gray-300">Movies</a>
            </div>
        </div>
        <input type="text" id="searchBar" placeholder="Search movies or shows..." class="bg-black/60 border border-gray-600 rounded px-4 py-1 text-sm focus:outline-none focus:border-white w-40 md:w-80">
    </nav>

    <!-- Hero Section -->
    <div id="hero" class="relative h-[75vh] w-full bg-cover bg-top flex items-end pb-24 pl-8 md:pl-16 shadow-[inset_0_-150px_100px_-20px_#141414]">
        <div class="max-w-2xl z-10">
            <h1 id="heroTitle" class="text-5xl md:text-7xl font-extrabold mb-4 uppercase italic">Kasen Stream</h1>
            <p id="heroDesc" class="text-sm md:text-lg mb-6 line-clamp-3 text-gray-200 drop-shadow-lg">Discover the latest blockbusters and trending shows.</p>
            <div class="flex gap-4">
                <button id="heroPlayBtn" class="bg-white text-black px-10 py-3 rounded font-bold hover:bg-gray-300 transition text-lg">▶ Play</button>
                <button class="bg-gray-500/50 text-white px-10 py-3 rounded font-bold hover:bg-gray-500/70 transition text-lg">ⓘ More Info</button>
            </div>
        </div>
    </div>

    <!-- Rows Section -->
    <div class="px-8 md:px-16 -mt-16 relative z-20 space-y-4">
        <div id="searchSection" class="hidden">
            <h2 class="text-2xl font-bold text-red-600">Search Results</h2>
            <div id="searchRow" class="row-container scrollbar-hide"></div>
        </div>

        <h2 class="text-xl font-bold">Trending Now</h2>
        <div id="trendingRow" class="row-container scrollbar-hide"></div>

        <h2 id="tv-row" class="text-xl font-bold">Popular TV Shows</h2>
        <div id="tvRow" class="row-container scrollbar-hide"></div>

        <h2 id="movies-row" class="text-xl font-bold">Action Movies</h2>
        <div id="actionRow" class="row-container scrollbar-hide"></div>

        <h2 class="text-xl font-bold">Horror</h2>
        <div id="horrorRow" class="row-container scrollbar-hide"></div>
    </div>

    <!-- Video Player Modal -->
    <div id="playerModal" class="fixed inset-0 bg-black z-[200] hidden flex flex-col">
        <div class="p-4 flex justify-between items-center bg-black">
            <h3 id="playingTitle" class="font-bold text-xl"></h3>
            <button id="closePlayer" class="text-white text-3xl font-light hover:text-red-600">&times; CLOSE</button>
        </div>
        <iframe id="videoPlayer" class="w-full h-full border-0" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    </div>

    <script>
        const API_KEY = '70c6183515ac89cbab2dbdea3a6c6124'; // <--- MUST ENTER YOUR KEY FROM THEMOVIEWEB
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/original';
        
        // Settings for the Player from your request
        const PARAMS = "autoplay=true&poster=true&title=true&download=true&watchparty=true&chromecast=true&servericon=true&setting=true&pip=true&icons=netflix&primarycolor=6C63FF&secondarycolor=9F9BFF&iconcolor=FFFFFF&logourl=https%3A%2F%2Fi.ibb.co%2F67wTJd9R%2Fpngimg-com-netflix-PNG11.png&font=Roboto&fontcolor=FFFFFF&fontsize=20&opacity=0.5";

        async function fetchContent(path, elementId, isTV = false) {
            const res = await fetch(`${BASE_URL}${path}?api_key=${API_KEY}`);
            const data = await res.json();
            const container = document.getElementById(elementId);
            
            data.results.forEach(item => {
                if(!item.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.style.backgroundImage = `url(${IMG_URL + item.poster_path})`;
                card.onclick = () => openPlayer(item.id, item.title || item.name, isTV);
                container.appendChild(card);
            });
            if(elementId === 'trendingRow') setHero(data.results[0]);
        }

        function setHero(movie) {
            document.getElementById('hero').style.backgroundImage = `url(${IMG_URL + movie.backdrop_path})`;
            document.getElementById('heroTitle').innerText = movie.title || movie.name;
            document.getElementById('heroDesc').innerText = movie.overview;
            document.getElementById('heroPlayBtn').onclick = () => openPlayer(movie.id, movie.title || movie.name, false);
        }

        function openPlayer(id, title, isTV) {
            document.getElementById('playingTitle').innerText = title;
            // Build URL based on Screenshots: /movie/{id} or /tv/{id}/1/1
            const type = isTV ? `tv/${id}/1/1` : `movie/${id}`;
            const finalUrl = `https://player.vidplus.to/embed/${type}?${PARAMS}`;
            
            document.getElementById('videoPlayer').src = finalUrl;
            document.getElementById('playerModal').classList.remove('hidden');
        }

        document.getElementById('closePlayer').onclick = () => {
            document.getElementById('playerModal').classList.add('hidden');
            document.getElementById('videoPlayer').src = "";
        };

        // Automatic Search Logic
        document.getElementById('searchBar').addEventListener('input', async (e) => {
            const query = e.target.value;
            if(query.length > 2) {
                document.getElementById('searchSection').classList.remove('hidden');
                const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${query}`);
                const data = await res.json();
                const container = document.getElementById('searchRow');
                container.innerHTML = '';
                data.results.forEach(item => {
                    if(!item.poster_path) return;
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.style.backgroundImage = `url(${IMG_URL + item.poster_path})`;
                    card.onclick = () => openPlayer(item.id, item.title || item.name, item.media_type === 'tv');
                    container.appendChild(card);
                });
            } else {
                document.getElementById('searchSection').classList.add('hidden');
            }
        });

        window.onscroll = () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        };

        // Load Categories
        fetchContent('/trending/all/week', 'trendingRow');
        fetchContent('/tv/popular', 'tvRow', true);
        fetchContent('/discover/movie?with_genres=28', 'actionRow');
        fetchContent('/discover/movie?with_genres=27', 'horrorRow');

    </script>
</body>
</html>
