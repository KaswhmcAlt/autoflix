<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kasen Stream</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      content: [],
      theme: {
        extend: {
          colors: {
            'neon-teal': '#00f5d4',
            'deep-black': '#0a0a0f',
            'glass': 'rgba(15, 23, 42, 0.75)'
          }
        }
      }
    }
  </script>

  <!-- PWA manifest -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Kasen Stream","short_name":"K-Stream","start_url":".","display":"standalone","background_color":"#0a0a0f","theme_color":"#00f5d4","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%2300f5d4%22/%3E%3Cpath d=%22M20 22h24v4H20zM20 32h24v4H20zM20 42h18v4H20z%22 fill=%22%230a0a0f%22/%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>

  <meta name="theme-color" content="#00f5d4" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500&amp;display=swap');
    
    :root { --tw-color-primary: #00f5d4; }
    
    * { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
    
    body {
      background: linear-gradient(180deg, #0a0a0f 0%, #050508 100%);
      color: #e0f2f5;
      font-family: 'Inter', system_ui, sans-serif;
    }
    
    .logo-font { font-family: 'Space Grotesk', sans-serif; }

    #siteHeader {
      background: rgba(10, 10, 15, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
    }

    #hero {
      min-height: 520px;
      background-size: cover;
      background-position: center 30%;
      position: relative;
    }
    #hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #0a0a0f 0%, rgba(10,10,15,0.4) 40%, rgba(10,10,15,0.85) 70%, #0a0a0f 100%);
      z-index: 1;
    }
    .hero-content { position: relative; z-index: 2; }

    .card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 16px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.4);
      position: relative;
      cursor: pointer;
      min-width: 180px;
      height: 270px;
    }
    .card:hover {
      transform: translateY(-10px) scale(1.04);
      box-shadow: 0 25px 50px -12px rgb(0 245 212 / 0.3);
    }
    .card .play-overlay {
      opacity: 0;
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 15, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .card:hover .play-overlay { opacity: 1; }
    
    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, transparent 30%, rgba(10,10,15,0.92) 85%);
      padding: 20px 16px 16px;
      z-index: 20;
    }
    
    .progress-bar {
      height: 5px;
      background: rgba(255,255,255,0.1);
      border-radius: 9999px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00f5d4, #00c4b8);
      box-shadow: 0 0 12px #00f5d4;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    
    #playerModal {
      background: rgba(10, 10, 15, 0.98);
      backdrop-filter: blur(12px);
    }
    
    .row-label {
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }
    
    .row-scroll {
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .row-scroll > * { scroll-snap-align: start; }

    /* Auth & Profile modals */
    .modal {
      animation: fadeInScale 0.2s ease forwards;
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="antialiased">

  <!-- HEADER -->
  <header id="siteHeader" class="fixed top-0 left-0 right-0 z-50 border-b border-white/10">
    <div class="max-w-screen-2xl mx-auto flex items-center justify-between px-8 py-4">
      
      <!-- Logo -->
      <div class="flex items-center gap-x-3">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-[#00f5d4] to-[#00c4b8] flex items-center justify-center shadow-[0_0_20px_-3px_#00f5d4] flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#0a0a0f]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 4.01V8" />
          </svg>
        </div>
        <h1 class="logo-font text-3xl font-medium tracking-[-1px] text-white">kasen</h1>
        <span class="text-[#00f5d4] text-xs font-semibold tracking-[2px] uppercase mt-1">STREAM</span>
      </div>

      <!-- Search -->
      <div class="flex-1 max-w-xl mx-8">
        <div class="relative">
          <input id="searchBar" placeholder="Search movies, TV shows..." 
                 class="w-full bg-white/10 hover:bg-white/15 border border-white/10 focus:border-[#00f5d4] text-white placeholder:text-white/50 rounded-3xl pl-12 py-3 text-sm focus:outline-none">
          <div class="absolute left-5 top-1/2 -translate-y-1/2 text-white/40">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 01-14 0 7 7 0 0114 0z" /></svg>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-x-6">
        <!-- Home -->
        <button onclick="showHome()" class="flex items-center gap-x-2 px-6 py-2.5 text-sm font-medium rounded-3xl hover:bg-white/10 text-white">Home</button>

        <!-- Profile selector -->
        <div onclick="showProfileModal()" class="flex items-center gap-x-3 cursor-pointer">
          <div id="currentProfileDisplay" class="flex items-center gap-x-2">
            <div id="profileAvatar" class="w-8 h-8 rounded-2xl bg-gradient-to-br from-purple-400 to-pink-400 flex items-center justify-center text-lg ring-2 ring-[#00f5d4]/30"></div>
            <div>
              <div id="profileName" class="text-sm font-medium"></div>
            </div>
          </div>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white/60" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7" /></svg>
        </div>

        <!-- Sign in / out -->
        <button onclick="toggleAuthModal()" id="authBtn"
                class="px-5 py-2 text-sm font-semibold rounded-3xl bg-white/10 hover:bg-white/20 text-white">Sign In</button>
      </div>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="pt-20">
    <div class="max-w-screen-2xl mx-auto flex gap-8 px-8">

      <!-- SIDEBAR - More categories -->
      <aside class="sidebar hidden lg:flex w-72 flex-col rounded-3xl p-6 text-sm h-[calc(100vh-6rem)] sticky top-6">
        <nav class="space-y-1 flex-1">
          <div class="font-semibold text-white/90 mb-6 flex items-center gap-x-2">Browse</div>
          
          <button onclick="switchCategory(this)" data-path="/trending/all/week" class="categoryBtn flex w-full items-center gap-x-3 text-left px-4 py-4 rounded-2xl hover:bg-white/10 active:bg-[#00f5d4]/10 text-white font-medium">
            🔥 Trending Now
          </button>
          <button onclick="switchCategory(this)" data-path="/movie/top_rated" class="categoryBtn flex w-full items-center gap-x-3 text-left px-4 py-4 rounded-2xl hover:bg-white/10 active:bg-[#00f5d4]/10 text-white font-medium">
            ⭐ Top Rated
          </button>
          <button onclick="switchCategory(this)" data-path="/tv/popular" data-tv="1" class="categoryBtn flex w-full items-center gap-x-3 text-left px-4 py-4 rounded-2xl hover:bg-white/10 active:bg-[#00f5d4]/10 text-white font-medium">
            📺 TV Shows
          </button>

          <div class="pt-6 border-t border-white/10 mt-6">
            <div class="font-semibold text-white/90 mb-4">Genres</div>
            <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=28" class="categoryBtn flex w-full items-center gap-x-3 text-left px-4 py-3 rounded-2xl hover:bg-white/10 text-white/80">🔥 Action</button>
            <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=12" class="categoryBtn flex w-full items-center gap-x-3 text-left px-4 py-3 rounded-2xl hover:bg-white/10 text-white/80">🌌 Adventure</button>
            <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=16" class="categoryBtn flex w-full items-center gap-x-3 text-left px-4 py-3 rounded-2xl hover:bg-white/10 text-white/80">🦸 Animation</button>
            <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=35" class="categoryBtn flex w-full items-center gap-x-3 text-left px-4 py-3 rounded-2xl hover:bg-white/10 text-white/80">😂 Comedy</button>
            <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=18" class="categoryBtn flex w-full items-center gap-x-3 text-left px-4 py-3 rounded-2xl hover:bg-white/10 text-white/80">🎭 Drama</button>
            <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=27" class="categoryBtn flex w-full items-center gap-x-3 text-left px-4 py-3 rounded-2xl hover:bg-white/10 text-white/80">👻 Horror</button>
            <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=878" class="categoryBtn flex w-full items-center gap-x-3 text-left px-4 py-3 rounded-2xl hover:bg-white/10 text-white/80">🚀 Sci-Fi</button>
            <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=53" class="categoryBtn flex w-full items-center gap-x-3 text-left px-4 py-3 rounded-2xl hover:bg-white/10 text-white/80">🔪 Thriller</button>
            <button onclick="switchCategory(this)" data-path="/discover/movie?with_genres=99" class="categoryBtn flex w-full items-center gap-x-3 text-left px-4 py-3 rounded-2xl hover:bg-white/10 text-white/80">📜 Documentaries</button>
          </div>

          <!-- Continue Watching (per profile) -->
          <div onclick="loadContinueWatching()" class="mt-8 cursor-pointer flex items-center gap-x-3 text-left px-4 py-4 rounded-2xl hover:bg-white/10 active:bg-[#00f5d4]/10 text-white font-medium">
            ▶️ Continue Watching
          </div>
        </nav>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="flex-1 min-w-0 pb-12">
        
        <!-- HERO -->
        <section id="hero" class="rounded-3xl overflow-hidden mb-12 relative">
          <div class="hero-content p-8 md:p-12 lg:p-16 flex flex-col justify-end h-full min-h-[520px]">
            <div class="max-w-lg">
              <div id="heroBadge" class="inline-flex items-center gap-x-1.5 text-xs font-semibold uppercase tracking-widest bg-white/10 text-white px-4 h-7 rounded-3xl mb-4"></div>
              <h2 id="heroTitle" class="text-5xl md:text-6xl font-semibold leading-none logo-font tracking-[-1px] mb-4"></h2>
              <p id="heroDesc" class="text-white/80 text-lg md:text-xl line-clamp-3 mb-8"></p>
              
              <button onclick="playHero()" 
                      class="flex items-center gap-x-3 bg-white text-black font-semibold text-lg px-8 h-14 rounded-3xl hover:scale-105 active:scale-95 shadow-xl shadow-[#00f5d4]/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 4.01V8" />
                </svg>
                <span>Play Now</span>
              </button>
            </div>
          </div>
        </section>

        <!-- ROWS -->
        <div id="rows" class="space-y-12"></div>
      </main>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div onclick="if(event.target.id==='authModal')hideAuthModal()" id="authModal" class="hidden fixed inset-0 bg-black/80 z-[10000] flex items-center justify-center">
    <div onclick="event.stopImmediatePropagation()" class="modal bg-[#0a0a0f] rounded-3xl w-full max-w-md mx-4 p-8">
      <div class="flex justify-between items-center mb-6">
        <h2 id="authTitle" class="text-3xl font-semibold logo-font">Sign In</h2>
        <button onclick="hideAuthModal()" class="text-4xl text-white/40 leading-none">×</button>
      </div>
      
      <div class="flex border-b border-white/10 mb-6">
        <button onclick="switchAuthTab(0)" id="tabSignIn" class="flex-1 pb-3 text-center font-medium border-b-2 border-[#00f5d4]">Sign In</button>
        <button onclick="switchAuthTab(1)" id="tabSignUp" class="flex-1 pb-3 text-center font-medium">Sign Up</button>
      </div>
      
      <div id="authForm">
        <input id="emailInput" type="email" placeholder="Email" class="w-full mb-3 bg-white/10 border border-white/10 rounded-2xl px-5 py-4 text-white placeholder:text-white/40 focus:border-[#00f5d4]">
        <input id="passwordInput" type="password" placeholder="Password" class="w-full mb-6 bg-white/10 border border-white/10 rounded-2xl px-5 py-4 text-white placeholder:text-white/40 focus:border-[#00f5d4]">
        
        <button onclick="handleAuth()" id="authSubmitBtn"
                class="w-full bg-[#00f5d4] text-black font-semibold py-4 rounded-2xl text-lg">Sign In</button>
        
        <p id="authFooter" class="text-center text-xs text-white/40 mt-6">Demo mode — any email + password works</p>
      </div>
    </div>
  </div>

  <!-- PROFILE SWITCHER MODAL (Netflix style) -->
  <div onclick="if(event.target.id==='profileModal')hideProfileModal()" id="profileModal" class="hidden fixed inset-0 bg-black/80 z-[10000] flex items-center justify-center">
    <div onclick="event.stopImmediatePropagation()" class="modal bg-[#0a0a0f] rounded-3xl w-full max-w-lg mx-4 p-8">
      <h2 class="text-2xl font-semibold mb-6">Who's watching?</h2>
      
      <div id="profilesList" class="grid grid-cols-2 gap-6"></div>
      
      <div class="mt-8 flex justify-between">
        <button onclick="hideProfileModal()" class="text-white/60 hover:text-white">Cancel</button>
        <button onclick="addNewProfile()" class="flex items-center gap-x-2 text-[#00f5d4] hover:underline">
          <span class="text-2xl">+</span> Add Profile
        </button>
      </div>
    </div>
  </div>

  <!-- PLAYER -->
  <div id="playerModal" class="fixed inset-0 z-[9999] hidden flex flex-col">
    <div class="flex items-center justify-between px-8 py-5 border-b border-white/10 bg-black/70 backdrop-blur-md">
      <div>
        <div id="playingTitle" class="text-xl font-semibold"></div>
        <div id="playerSub" class="text-white/60 text-sm"></div>
      </div>
      <button onclick="closePlayer()" class="flex items-center justify-center w-10 h-10 rounded-2xl hover:bg-white/10 text-4xl leading-none text-white/80">×</button>
    </div>
    
    <div class="flex-1 relative bg-black">
      <iframe id="embed_iframe" class="w-full h-full" frameborder="0"
              allow="autoplay *; fullscreen *; picture-in-picture *; encrypted-media *"
              allowfullscreen></iframe>
    </div>
  </div>

  <script>
    /***** CONFIG *****/
    const TMDB_KEY = '70c6183515ac89cbab2dbdea3a6c6124';
    const TMDB_BASE = 'https://api.themoviedb.org/3';
    const IMG_URL = 'https://image.tmdb.org/t/p/';
    const EMBEDMASTER_BASE = 'https://embedmaster.link';
    const EMBEDMASTER_PLAYER_ID = 'YOUR_PLAYER_ID_HERE';

    // Expanded categories
    let ROWS = [
      { id: 'r_trending', label: 'Trending Now', path: '/trending/all/week', isTV: false },
      { id: 'r_top', label: 'Top Rated Movies', path: '/movie/top_rated', isTV: false },
      { id: 'r_tv', label: 'Popular TV Shows', path: '/tv/popular', isTV: true },
      { id: 'r_action', label: 'Action & Adventure', path: '/discover/movie?with_genres=28', isTV: false },
      { id: 'r_comedy', label: 'Comedy', path: '/discover/movie?with_genres=35', isTV: false },
      { id: 'r_scifi', label: 'Sci-Fi', path: '/discover/movie?with_genres=878', isTV: false },
      { id: 'r_drama', label: 'Drama', path: '/discover/movie?with_genres=18', isTV: false }
    ];

    /***** STATE *****/
    let currentUser = null;           // { id: number, name: string, email: string }
    let currentProfile = null;        // { id: number, name: string, avatar: string }
    let profiles = [
      { id: 1, name: "Kasen", avatar: "👾" },
      { id: 2, name: "Family", avatar: "👨‍👩‍👧" },
      { id: 3, name: "Kids", avatar: "🧸" }
    ];
    let current = null;               // player state
    let lastKnownTime = 0;
    let sessionStart = 0;

    /***** Progress (per profile) *****/
    function progressKey(id) {
      if (!currentProfile) return 'ks_progress_' + id;
      return `ks_progress_${currentProfile.id}_${id}`;
    }
    function loadProgress(id) {
      try {
        const raw = localStorage.getItem(progressKey(id));
        return raw ? JSON.parse(raw) : { seconds: 0 };
      } catch (e) { return { seconds: 0 }; }
    }
    function saveProgress(id, obj) {
      try { localStorage.setItem(progressKey(id), JSON.stringify(obj)); } catch(e) {}
    }

    /***** DOM refs *****/
    const rowsContainer = document.getElementById('rows');
    const iframe = document.getElementById('embed_iframe');
    const playerModal = document.getElementById('playerModal');
    const playingTitle = document.getElementById('playingTitle');
    const playerSub = document.getElementById('playerSub');
    const searchBar = document.getElementById('searchBar');
    const profileNameEl = document.getElementById('profileName');
    const profileAvatarEl = document.getElementById('profileAvatar');
    const authBtn = document.getElementById('authBtn');

    /***** Helpers *****/
    async function fetchJson(url) {
      try {
        const res = await fetch(url);
        return res.ok ? await res.json() : null;
      } catch(e) { return null; }
    }

    /***** Load cinematic hero (first trending) *****/
    async function loadHero() {
      const heroEl = document.getElementById('hero');
      const titleEl = document.getElementById('heroTitle');
      const descEl = document.getElementById('heroDesc');
      const badgeEl = document.getElementById('heroBadge');

      const data = await fetchJson(`${TMDB_BASE}/trending/all/week?api_key=${TMDB_KEY}`);
      if (!data?.results?.[0]) return;

      const item = data.results[0];
      const isTV = !!item.name;
      
      if (item.backdrop_path) heroEl.style.backgroundImage = `url(${IMG_URL}original${item.backdrop_path})`;
      
      titleEl.textContent = item.title || item.name;
      descEl.textContent = (item.overview || '').slice(0, 160) + '...';
      
      badgeEl.innerHTML = `${isTV ? '📺 SERIES' : '🎬 MOVIE'} <span class="text-[#00f5d4]">★</span> ${item.vote_average?.toFixed(1) || 'N/A'}`;
      
      heroEl.dataset.id = item.id;
      heroEl.dataset.tv = isTV ? '1' : '0';
      heroEl.dataset.title = item.title || item.name;
    }

    window.playHero = function() {
      const hero = document.getElementById('hero');
      const id = parseInt(hero.dataset.id);
      const isTV = hero.dataset.tv === '1';
      const title = hero.dataset.title;
      if (id) openPlayer(id, title, isTV);
    };

    /***** Create & load rows *****/
    function createRow(row) {
      const section = document.createElement('section');
      section.className = 'space-y-4';
      section.innerHTML = `
        <div class="flex items-baseline justify-between">
          <h3 class="row-label font-semibold text-white">${row.label}</h3>
          <span onclick="switchCategory(this)" data-path="${row.path}" data-tv="${row.isTV}" class="text-[#00f5d4] text-sm cursor-pointer flex items-center hover:underline">See all →</span>
        </div>
        <div id="${row.id}" class="flex gap-4 overflow-x-auto row-scroll pb-6"></div>
      `;
      rowsContainer.appendChild(section);
    }

    async function loadRow(row) {
      const container = document.getElementById(row.id);
      if (!container) return;
      
      container.innerHTML = `<div class="text-white/30 py-12 text-center">Loading...</div>`;
      
      const url = `${TMDB_BASE}${row.path}${row.path.includes('?') ? '&' : '?'}api_key=${TMDB_KEY}&language=en-US`;
      const data = await fetchJson(url);
      
      container.innerHTML = '';
      if (!data?.results?.length) return;

      data.results.forEach(item => {
        if (!item.poster_path) return;
        const id = item.id;
        const title = item.title || item.name || 'Untitled';
        const poster = IMG_URL + 'w342' + item.poster_path;
        const year = (item.release_date || item.first_air_date || '').slice(0,4);
        const rating = item.vote_average ? item.vote_average.toFixed(1) : '—';
        const isTV = row.isTV || item.media_type === 'tv';

        const cardHTML = `
          <div class="card" data-id="${id}" data-tv="${isTV?1:0}" style="background-image:url('${poster}')">
            <div class="play-overlay">
              <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-2xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-black ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132z" /></svg>
              </div>
            </div>
            <div class="card-overlay">
              <div class="flex justify-between items-start mb-2">
                <div class="font-semibold text-base leading-tight">${title.length > 22 ? title.slice(0,20)+'…' : title}</div>
                <div class="text-[10px] font-bold px-2 py-px rounded-xl bg-black/70 text-[#00f5d4]">${rating}</div>
              </div>
              <div class="flex justify-between text-xs text-white/70 mb-3">
                <span>${year}</span>
                <span class="uppercase">${isTV ? 'TV' : 'MOVIE'}</span>
              </div>
              <div class="progress-bar"><div id="fill-${id}" class="progress-fill" style="width:0%"></div></div>
            </div>
          </div>`;

        const wrapper = document.createElement('div');
        wrapper.innerHTML = cardHTML;
        const card = wrapper.firstElementChild;
        card.addEventListener('click', () => openPlayer(id, title, isTV));
        container.appendChild(card);
        
        updateCardProgressUI(id, isTV);
      });
    }

    /***** Progress UI *****/
    async function updateCardProgressUI(id, isTV = null) {
      const fill = document.getElementById(`fill-${id}`);
      if (!fill) return;
      const data = loadProgress(id);
      if (!data.seconds) return;

      try {
        const el = document.querySelector(`[data-id="${id}"]`);
        if (isTV === null && el) isTV = el.dataset.tv === '1';
        
        const path = isTV ? `/tv/${id}` : `/movie/${id}`;
        const info = await fetchJson(`${TMDB_BASE}${path}?api_key=${TMDB_KEY}`);
        
        let runtimeSec = info ? (isTV ? (info.episode_run_time?.[0]||30) * 60 : info.runtime * 60) : 7200;
        const pct = Math.min(100, Math.round((data.seconds / runtimeSec) * 100));
        fill.style.width = pct + '%';
      } catch(e) {
        fill.style.width = '35%';
      }
    }

    /***** Player logic *****/
    async function getImdbId(tmdbId, isTV) {
      try {
        const path = isTV ? `/tv/${tmdbId}/external_ids` : `/movie/${tmdbId}/external_ids`;
        const res = await fetchJson(`${TMDB_BASE}${path}?api_key=${TMDB_KEY}`);
        return res?.imdb_id || null;
      } catch(e) { return null; }
    }

    async function buildEmbedUrl(tmdbId, isTV) {
      const imdb = await getImdbId(tmdbId, isTV);
      const idForEmbed = imdb || tmdbId;
      const base = EMBEDMASTER_PLAYER_ID && EMBEDMASTER_PLAYER_ID !== 'YOUR_PLAYER_ID_HERE' 
        ? `${EMBEDMASTER_BASE}/${EMBEDMASTER_PLAYER_ID}` 
        : EMBEDMASTER_BASE;
      return isTV ? `${base}/tv/${idForEmbed}/1/1` : `${base}/movie/${idForEmbed}`;
    }

    async function openPlayer(tmdbId, title, isTV = false) {
      current = { tmdbId, isTV };
      playingTitle.textContent = title;
      playerSub.textContent = isTV ? 'TV Series' : 'Movie';
      
      playerModal.classList.remove('hidden');
      const url = await buildEmbedUrl(tmdbId, isTV);
      iframe.src = url + (url.includes('?') ? '&' : '?') + 'autoplay=true';
      
      iframe.onload = () => {
        const saved = loadProgress(tmdbId);
        if (saved.seconds > 10) sendCommand('seek', Math.floor(saved.seconds));
        sessionStart = Date.now();
      };
    }

    function closePlayer() {
      if (sessionStart && current) {
        const delta = (Date.now() - sessionStart) / 1000;
        const saved = loadProgress(current.tmdbId);
        saved.seconds = Math.max(saved.seconds || 0, Math.round((saved.seconds || 0) + delta));
        saveProgress(current.tmdbId, saved);
      }
      if (lastKnownTime && current) {
        const saved = loadProgress(current.tmdbId);
        saved.seconds = Math.max(saved.seconds || 0, Math.round(lastKnownTime));
        saveProgress(current.tmdbId, saved);
      }
      if (current) updateCardProgressUI(current.tmdbId, current.isTV);
      
      iframe.src = '';
      playerModal.classList.add('hidden');
      current = null;
      lastKnownTime = 0;
    }

    function sendCommand(command, value = null) {
      if (iframe.contentWindow) {
        iframe.contentWindow.postMessage({ source: 'embedmaster_player_command', command, value }, '*');
      }
    }

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || (data.source !== 'embedmaster_player' && data.source !== 'embedmaster_player_event')) return;
      
      if (data.event === 'timeupdate' && data.info?.currentTime) {
        lastKnownTime = data.info.currentTime;
        if (current) {
          const saved = loadProgress(current.tmdbId);
          saved.seconds = Math.round(data.info.currentTime);
          saveProgress(current.tmdbId, saved);
          updateCardProgressUI(current.tmdbId, current.isTV);
        }
      }
      if (data.event === 'ended' && current) {
        saveProgress(current.tmdbId, { seconds: 0 });
        updateCardProgressUI(current.tmdbId, current.isTV);
      }
    });

    /***** Search *****/
    searchBar.addEventListener('input', async (e) => {
      const q = e.target.value.trim();
      if (q.length > 2) {
        rowsContainer.innerHTML = `
          <section class="space-y-4">
            <h3 class="row-label font-semibold text-white">Results for “${q}”</h3>
            <div id="searchRow" class="flex gap-4 overflow-x-auto row-scroll pb-6"></div>
          </section>`;
        const data = await fetchJson(`${TMDB_BASE}/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}`);
        const container = document.getElementById('searchRow');
        container.innerHTML = '';
        (data?.results || []).forEach(item => {
          if (!item.poster_path) return;
          const id = item.id;
          const title = item.title || item.name || '';
          const poster = IMG_URL + 'w342' + item.poster_path;
          const isTV = item.media_type === 'tv';
          const cardHTML = `
            <div class="card" style="background-image:url('${poster}')" data-id="${id}" data-tv="${isTV?1:0}">
              <div class="play-overlay"><div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-2xl"><svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-black ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132z" /></svg></div></div>
              <div class="card-overlay"><div class="font-semibold">${title}</div><div class="progress-bar mt-4"><div id="fill-${id}" class="progress-fill"></div></div></div>
            </div>`;
          const wrapper = document.createElement('div');
          wrapper.innerHTML = cardHTML;
          wrapper.firstElementChild.addEventListener('click', () => openPlayer(id, title, isTV));
          container.appendChild(wrapper.firstElementChild);
          updateCardProgressUI(id, isTV);
        });
      } else {
        showHome();
      }
    });

    /***** Category switching (now fully functional) *****/
    window.switchCategory = async function(el) {
      const path = el.getAttribute('data-path');
      const isTV = el.getAttribute('data-tv') === '1';
      
      rowsContainer.innerHTML = `
        <div class="flex items-center justify-between mb-6">
          <h3 class="row-label font-semibold text-white">Category</h3>
          <button onclick="showHome()" class="text-[#00f5d4] text-sm flex items-center gap-x-1">← Back to Home</button>
        </div>
        <div id="categoryRow" class="flex gap-4 overflow-x-auto row-scroll pb-6"></div>`;

      const container = document.getElementById('categoryRow');
      container.innerHTML = `<div class="text-white/30 py-12">Loading category...</div>`;
      
      const data = await fetchJson(`${TMDB_BASE}${path}${path.includes('?') ? '&' : '?'}api_key=${TMDB_KEY}`);
      
      container.innerHTML = '';
      (data?.results || []).forEach(item => {
        if (!item.poster_path) return;
        const id = item.id;
        const title = item.title || item.name || '';
        const poster = IMG_URL + 'w342' + item.poster_path;
        const card = document.createElement('div');
        card.className = 'card';
        card.style.backgroundImage = `url(${poster})`;
        card.innerHTML = `
          <div class="play-overlay"><div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-2xl"><svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-black ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132z" /></svg></div></div>
          <div class="card-overlay"><div class="font-semibold text-base">${title}</div></div>`;
        card.addEventListener('click', () => openPlayer(id, title, isTV));
        container.appendChild(card);
      });
    };

    /***** Continue Watching row (per profile) *****/
    async function loadContinueWatching() {
      rowsContainer.innerHTML = `
        <div class="flex items-center justify-between mb-6">
          <h3 class="row-label font-semibold text-white">Continue Watching</h3>
          <button onclick="showHome()" class="text-[#00f5d4] text-sm flex items-center gap-x-1">← Back</button>
        </div>
        <div id="continueRow" class="flex gap-4 overflow-x-auto row-scroll pb-6"></div>`;

      const container = document.getElementById('continueRow');
      container.innerHTML = `<div class="text-white/30 py-12">Looking for your progress...</div>`;

      // Find all keys for current profile that have progress
      const progressItems = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith(`ks_progress_${currentProfile?.id || ''}_`)) {
          const id = parseInt(key.split('_').pop());
          const data = loadProgress(id);
          if (data.seconds > 60) progressItems.push({ id, seconds: data.seconds });
        }
      }

      if (!progressItems.length) {
        container.innerHTML = `<div class="text-white/30 py-12">Nothing watched yet — start watching something!</div>`;
        return;
      }

      for (const item of progressItems) {
        const info = await fetchJson(`${TMDB_BASE}/movie/${item.id}?api_key=${TMDB_KEY}`);
        if (!info || !info.poster_path) continue;
        
        const card = document.createElement('div');
        card.className = 'card';
        card.style.backgroundImage = `url(${IMG_URL}w342${info.poster_path})`;
        card.innerHTML = `
          <div class="play-overlay"><div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-2xl"><svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-black ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132z" /></svg></div></div>
          <div class="card-overlay">
            <div class="font-semibold">${info.title}</div>
            <div class="progress-bar mt-3"><div class="progress-fill" style="width:35%"></div></div>
          </div>`;
        card.addEventListener('click', () => openPlayer(item.id, info.title, false));
        container.appendChild(card);
      }
    }

    /***** Show home with all rows *****/
    function showHome() {
      rowsContainer.innerHTML = '';
      ROWS.forEach(r => {
        createRow(r);
        loadRow(r);
      });
    }

    /***** Auth system (demo) *****/
    function toggleAuthModal() {
      if (currentUser) {
        // logout
        currentUser = null;
        currentProfile = null;
        authBtn.textContent = 'Sign In';
        profileNameEl.textContent = '';
        profileAvatarEl.innerHTML = '';
        showHome();
        return;
      }
      document.getElementById('authModal').classList.remove('hidden');
      switchAuthTab(0);
    }
    function hideAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
    }
    function switchAuthTab(n) {
      const title = document.getElementById('authTitle');
      const btn = document.getElementById('authSubmitBtn');
      title.textContent = n === 0 ? 'Sign In' : 'Create Account';
      btn.textContent = n === 0 ? 'Sign In' : 'Create Account';
      document.getElementById('tabSignIn').classList.toggle('border-b-2', n===0);
      document.getElementById('tabSignIn').classList.toggle('border-[#00f5d4]', n===0);
      document.getElementById('tabSignUp').classList.toggle('border-b-2', n===1);
      document.getElementById('tabSignUp').classList.toggle('border-[#00f5d4]', n===1);
    }
    function handleAuth() {
      // Demo — any input works
      const email = document.getElementById('emailInput').value || 'user@kasen.stream';
      currentUser = { id: Date.now(), name: email.split('@')[0], email };
      currentProfile = profiles[0]; // default to first profile
      
      hideAuthModal();
      authBtn.textContent = 'Sign Out';
      updateProfileUI();
      showHome();
    }

    /***** Profile management (Netflix style) *****/
    function updateProfileUI() {
      if (!currentProfile) return;
      profileNameEl.textContent = currentProfile.name;
      profileAvatarEl.textContent = currentProfile.avatar;
    }

    function showProfileModal() {
      if (!currentUser) return toggleAuthModal();
      const container = document.getElementById('profilesList');
      container.innerHTML = '';
      profiles.forEach(p => {
        const div = document.createElement('div');
        div.className = `flex flex-col items-center cursor-pointer ${currentProfile.id === p.id ? 'ring-2 ring-[#00f5d4]' : ''}`;
        div.innerHTML = `
          <div class="w-20 h-20 rounded-3xl flex items-center justify-center text-5xl mb-3 shadow-inner">${p.avatar}</div>
          <div class="text-white">${p.name}</div>`;
        div.onclick = () => {
          currentProfile = p;
          hideProfileModal();
          updateProfileUI();
          showHome();
        };
        container.appendChild(div);
      });
      document.getElementById('profileModal').classList.remove('hidden');
    }
    function hideProfileModal() {
      document.getElementById('profileModal').classList.add('hidden');
    }
    function addNewProfile() {
      const name = prompt("New profile name?", "New Profile");
      if (name) {
        const newProfile = { id: Date.now(), name: name.trim(), avatar: "🆕" };
        profiles.push(newProfile);
        currentProfile = newProfile;
        hideProfileModal();
        updateProfileUI();
        showHome();
      }
    }

    /***** Init *****/
    async function initialize() {
      await loadHero();
      showHome();
      
      // Keyboard escape for player
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !playerModal.classList.contains('hidden')) closePlayer();
      });
      
      // Fake logged-in state for demo (remove in production)
      console.log('%c✅ Kasen Stream v2 ready — multi-profile + auth + extra categories active!', 'color:#00f5d4; font-size:13px');
    }

    window.onload = initialize;
  </script>
</body>
