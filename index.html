<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>Kasen Stream | Unlimited</title>

  <!-- PWA & Mobile Optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    
    body { 
      background: #050505; 
      color: #fff; 
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #050505; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

    .hero-gradient {
      background: linear-gradient(0deg, #050505 0%, rgba(5,5,5,0) 100%);
    }

    .movie-card {
      aspect-ratio: 2/3;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .movie-card:hover {
      transform: scale(1.05);
      z-index: 10;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .nav-blur {
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .active-nav {
      color: #00f5d4;
      border-bottom: 2px solid #00f5d4;
    }

    /* Fix for mobile category bar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="antialiased">

  <!-- TOP NAV -->
  <nav class="fixed top-0 inset-x-0 z-[100] nav-blur border-b border-white/5">
    <div class="max-w-[1800px] mx-auto px-4 md:px-10 h-16 flex items-center justify-between">
      <div class="flex items-center gap-8">
        <h1 class="text-2xl font-extrabold tracking-tighter text-white" onclick="location.reload()" style="cursor:pointer">
          KASEN<span class="text-[#00f5d4]">STREAM</span>
        </h1>
        <div class="hidden lg:flex items-center gap-6 text-sm font-semibold text-gray-400">
          <button onclick="loadSection('trending')" class="hover:text-white transition">Trending</button>
          <button onclick="loadSection('movie')" class="hover:text-white transition">Movies</button>
          <button onclick="loadSection('tv')" class="hover:text-white transition">TV Shows</button>
          <button onclick="loadSection('action')" class="hover:text-white transition">Action</button>
        </div>
      </div>

      <div class="flex items-center gap-4 flex-1 max-w-sm ml-4">
        <div class="relative w-full">
          <input id="searchBar" type="text" placeholder="Search movies..." 
                 class="w-full bg-white/10 border-none rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-[#00f5d4] outline-none transition">
        </div>
      </div>
    </div>
  </nav>

  <!-- MOBILE GENRE PICKER -->
  <div class="lg:hidden fixed top-16 inset-x-0 z-[90] nav-blur border-b border-white/5 flex items-center gap-6 px-4 h-12 overflow-x-auto no-scrollbar text-xs font-bold uppercase tracking-widest text-gray-400">
    <button onclick="loadSection('trending')" class="whitespace-nowrap">🔥 Trending</button>
    <button onclick="loadSection('movie')" class="whitespace-nowrap">🎬 Movies</button>
    <button onclick="loadSection('tv')" class="whitespace-nowrap">📺 TV</button>
    <button onclick="loadSection('action')" class="whitespace-nowrap">💥 Action</button>
    <button onclick="loadSection('horror')" class="whitespace-nowrap">👻 Horror</button>
    <button onclick="loadSection('comedy')" class="whitespace-nowrap">😂 Comedy</button>
  </div>

  <main id="content" class="pt-28 lg:pt-16 pb-20">
    <!-- HERO SECTION -->
    <section id="hero" class="relative h-[60vh] md:h-[80vh] w-full overflow-hidden flex items-end mb-10">
      <div id="heroBg" class="absolute inset-0 bg-cover bg-center transition-opacity duration-1000"></div>
      <div class="absolute inset-0 hero-gradient"></div>
      <div class="relative px-4 md:px-10 pb-10 max-w-3xl">
        <h2 id="heroTitle" class="text-4xl md:text-7xl font-extrabold mb-4 leading-none"></h2>
        <p id="heroDesc" class="text-gray-300 text-sm md:text-lg mb-6 line-clamp-3"></p>
        <button id="heroPlay" class="bg-white text-black px-8 py-3 rounded-full font-bold text-lg hover:bg-[#00f5d4] transition flex items-center gap-2">
          <span>▶</span> Play Now
        </button>
      </div>
    </section>

    <!-- CONTENT GRID -->
    <div class="px-4 md:px-10">
      <h3 id="gridTitle" class="text-xl md:text-2xl font-bold mb-6">Featured Content</h3>
      <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6">
        <!-- Cards will populate here -->
      </div>
      <div id="loadingTrigger" class="h-20 flex items-center justify-center text-gray-500 italic">
        Scroll for more...
      </div>
    </div>
  </main>

  <!-- PLAYER MODAL -->
  <div id="playerModal" class="fixed inset-0 z-[200] bg-black hidden flex flex-col">
    <div class="h-16 flex items-center justify-between px-6 border-b border-white/10">
      <h4 id="nowPlaying" class="font-bold truncate"></h4>
      <button onclick="closePlayer()" class="text-3xl text-gray-400 hover:text-white transition">&times;</button>
    </div>
    <div class="flex-1 bg-black">
      <iframe id="videoFrame" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const TMDB_KEY = '70c6183515ac89cbab2dbdea3a6c6124';
    const TMDB_BASE = 'https://api.themoviedb.org/3';
    const IMG_BASE = 'https://image.tmdb.org/t/p/original';
    const POSTER_BASE = 'https://image.tmdb.org/t/p/w500';

    let currentPage = 1;
    let currentEndpoint = '/trending/all/week';
    let isFetching = false;

    // Initialize
    async function init() {
      await loadHero();
      loadSection('trending');
    }

    async function loadHero() {
      const res = await fetch(`${TMDB_BASE}/trending/all/day?api_key=${TMDB_KEY}`);
      const data = await res.json();
      const movie = data.results[0];
      
      document.getElementById('heroBg').style.backgroundImage = `url(${IMG_BASE}${movie.backdrop_path})`;
      document.getElementById('heroTitle').innerText = movie.title || movie.name;
      document.getElementById('heroDesc').innerText = movie.overview;
      document.getElementById('heroPlay').onclick = () => openPlayer(movie.id, movie.title || movie.name, movie.media_type === 'tv');
    }

    async function loadSection(type) {
      document.getElementById('movieGrid').innerHTML = '';
      currentPage = 1;
      
      const endpoints = {
        'trending': '/trending/all/week',
        'movie': '/movie/popular',
        'tv': '/tv/popular',
        'action': '/discover/movie?with_genres=28',
        'horror': '/discover/movie?with_genres=27',
        'comedy': '/discover/movie?with_genres=35'
      };

      currentEndpoint = endpoints[type];
      document.getElementById('gridTitle').innerText = type.toUpperCase();
      await fetchMovies();
    }

    async function fetchMovies() {
      if (isFetching) return;
      isFetching = true;

      const connector = currentEndpoint.includes('?') ? '&' : '?';
      const url = `${TMDB_BASE}${currentEndpoint}${connector}api_key=${TMDB_KEY}&page=${currentPage}`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        renderCards(data.results);
        currentPage++;
      } catch (e) { console.error(e); }
      
      isFetching = false;
    }

    function renderCards(movies) {
      const grid = document.getElementById('movieGrid');
      movies.forEach(m => {
        if (!m.poster_path) return;
        const isTV = m.media_type === 'tv' || (!m.title && m.name);
        
        const card = document.createElement('div');
        card.className = 'movie-card bg-zinc-900 rounded-xl overflow-hidden relative group';
        card.innerHTML = `
          <img src="${POSTER_BASE}${m.poster_path}" class="w-full h-full object-cover" loading="lazy">
          <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition flex items-center justify-center p-4">
            <p class="text-center text-sm font-bold">${m.title || m.name}</p>
          </div>
        `;
        card.onclick = () => openPlayer(m.id, m.title || m.name, isTV);
        grid.appendChild(card);
      });
    }

    function openPlayer(id, title, isTV) {
      const modal = document.getElementById('playerModal');
      const frame = document.getElementById('videoFrame');
      document.getElementById('nowPlaying').innerText = title;
      
      const type = isTV ? 'tv' : 'movie';
      frame.src = `https://embedmaster.link/${type}/${id}${isTV ? '/1/1' : ''}?autoplay=1`;
      modal.classList.remove('hidden');
    }

    function closePlayer() {
      document.getElementById('playerModal').classList.add('hidden');
      document.getElementById('videoFrame').src = '';
    }

    // Infinite Scroll Logic
    window.onscroll = () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
        fetchMovies();
      }
    };

    // Search Logic
    document.getElementById('searchBar').oninput = async (e) => {
      const query = e.target.value;
      if (query.length > 2) {
        document.getElementById('gridTitle').innerText = `Results for "${query}"`;
        currentEndpoint = `/search/multi?query=${encodeURIComponent(query)}`;
        document.getElementById('movieGrid').innerHTML = '';
        currentPage = 1;
        fetchMovies();
      } else if (query.length === 0) {
        loadSection('trending');
      }
    };

    init();
  </script>
</body>
</html>
