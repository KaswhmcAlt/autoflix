<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kasenflix</title>
<!-- React & ReactDOM -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<!-- React Player -->
<script src="https://cdn.jsdelivr.net/npm/react-player/dist/react-player.min.js"></script>
<style>
  /* Basic styles, your existing styles plus modal styling */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: #fff; }
  #root { min-height: 100vh; }
  button { cursor: pointer; font-family: inherit; }

  /* Modal styles for trailer */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .modal-content {
    position: relative;
    max-width: 90%;
    max-height: 80%;
    background: #222;
    padding: 16px;
    border-radius: 8px;
  }
  .close-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect } = React;
const ReactPlayer = window.ReactPlayer;

// Firebase SDKs
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, signInWithPopup, GoogleAuthProvider, OAuthProvider } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// Firebase config (replace with your own)
const firebaseConfig = {
  apiKey: "AIzaSyAl6PzNwWQX5accTdcUZ8N7JPQA6NVoH4o",
  authDomain: "log-in-data-f19a9.firebaseapp.com",
  projectId: "log-in-data-f19a9",
  storageBucket: "log-in-data-f19a9.appspot.com",
  messagingSenderId: "546782630442",
  appId: "1:546782630442:web:d8c81d5d8b6512bc82e953",
  measurementId: "G-CJCTJYBL3Q"
};
const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const TMDB_KEY = '70c6183515ac89cbab2dbdea3a6c6124';
const TMDB_BASE = 'https://api.themoviedb.org/3';
const IMG_BASE = 'https://image.tmdb.org/t/p/w500';

// Utility functions
const getPoster = (item) => item.poster_path ? `${IMG_BASE}${item.poster_path}` : '';
const getBackdrop = (item) => item.backdrop_path ? `${IMG_BASE}${item.backdrop_path}` : '';
const getTitle = (item) => item.title || item.name || 'Untitled';

function App() {
  const [state, setState] = useState({
    user: null,
    profiles: [],
    activeProfile: null,
    view: 'loading', // auth, profile-picker, home, finder, trailer
    authMode: 'signin',
    authError: '',
    content: { trending: [], movies: [], tv: [], genres: [] },
    hero: null,
    foundMovie: null,
    tmdbLoading: false,
    editingProfileId: null,
    createName: '',
    createAvatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix",
    trailerUrl: null,
    showTrailer: false,
    genreFilter: null,
    movieTypeFilter: 'movie' // or 'tv'
  });

  // Firebase auth listener
  useEffect(() => {
    onAuthStateChanged(auth, user => {
      if (user) {
        // Load profiles
        loadProfiles(user.uid, setState);
        setState(prev => ({ ...prev, user, view: 'profile-picker' }));
      } else {
        setState(prev => ({ ...prev, user: null, profiles: [], activeProfile: null, view: 'auth' }));
      }
    });
  }, []);

  // Fetch TMDB data
  useEffect(() => {
    if (state.view === 'home') fetchTMDB(setState);
  }, [state.view]);

  // Firebase profile load
  const loadProfiles = (uid, set) => {
    const profilesRef = collection(db, 'artifacts', 'kasenflix-pro', 'users', uid, 'profiles');
    const unsubscribe = onSnapshot(profilesRef, snap => {
      const profiles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      set({ profiles });
    });
  };

  // Sign in
  const handleSignIn = async () => {
    const email = document.getElementById('auth-email')?.value;
    const password = document.getElementById('auth-password')?.value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      setState(prev => ({ ...prev, authError: e.message }));
    }
  };

  // Sign up
  const handleSignUp = async () => {
    const email = document.getElementById('auth-email')?.value;
    const password = document.getElementById('auth-password')?.value;
    try {
      await createUserWithEmailAndPassword(auth, email, password);
    } catch (e) {
      setState(prev => ({ ...prev, authError: e.message }));
    }
  };

  // Google sign-in
  const handleGoogleSignIn = async () => {
    const provider = new GoogleAuthProvider();
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      setState(prev => ({ ...prev, authError: e.message }));
    }
  };

  // Sign out
  const handleSignOut = async () => {
    await signOut(auth);
  };

  // Create profile
  const createProfile = async () => {
    if (!state.user || !state.createName.trim()) return;
    const profileId = crypto.randomUUID();
    await setDoc(doc(db, 'artifacts', 'kasenflix-pro', 'users', state.user.uid, 'profiles', profileId), {
      name: state.createName,
      avatar: state.createAvatar,
      myList: [],
      continueWatching: [],
      createdAt: Date.now()
    });
    // Reset
    setState(prev => ({ ...prev, view: 'profile-picker', createName: '', createAvatar: '' }));
  };

  // Delete profile
  const deleteProfile = async (profileId) => {
    if (!profileId || !auth.currentUser) return;
    await deleteDoc(doc(db, 'artifacts', 'kasenflix-pro', 'users', auth.currentUser.uid, 'profiles', profileId));
  };

  // Rename profile
  const renameProfile = async (profileId, newName) => {
    if (!profileId || !auth.currentUser || !newName.trim()) return;
    await updateDoc(doc(db, 'artifacts', 'kasenflix-pro', 'users', auth.currentUser.uid, 'profiles', profileId), { name: newName });
  };

  // Fetch TMDB data
  const fetchTMDB = async (set) => {
    set({ tmdbLoading: true });
    const trendingRes = await fetch(`${TMDB_BASE}/trending/all/week?api_key=${TMDB_KEY}`);
    const trendingData = await trendingRes.json();
    const moviesRes = await fetch(`${TMDB_BASE}/movie/popular?api_key=${TMDB_KEY}`);
    const moviesData = await moviesRes.json();
    const tvRes = await fetch(`${TMDB_BASE}/tv/popular?api_key=${TMDB_KEY}`);
    const tvData = await tvRes.json();
    const genresRes = await fetch(`${TMDB_BASE}/genre/movie/list?api_key=${TMDB_KEY}`);
    const genresData = await genresRes.json();

    set({ 
      content: { trending: trendingData.results, movies: moviesData.results, tv: tvData.results, genres: genresData.genres }, 
      hero: trendingData.results[0],
      tmdbLoading: false
    });
  };

  // Find random movie/show
  const handleFindMovie = () => {
    const list = getFilteredItems();
    if (!list.length) return;
    const item = list[Math.floor(Math.random() * list.length)];
    fetchTrailerUrl(item.id, item.media_type || (item.title ? 'movie' : 'tv')).then(trailerUrl => {
      if (trailerUrl) {
        handleShowTrailer(trailerUrl);
      } else {
        alert('Trailer not found');
      }
    });
  };

  // Fetch trailer URL
  const fetchTrailerUrl = async (id, media_type) => {
    const url = `${TMDB_BASE}/${media_type}/${id}/videos?api_key=${TMDB_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    const trailer = data.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
    if (trailer) {
      return `https://www.youtube.com/watch?v=${trailer.key}`;
    }
    return null;
  };

  // Show trailer modal
  const handleShowTrailer = (url) => {
    set({ trailerUrl: url, showTrailer: true });
  };

  const handleCloseTrailer = () => {
    set({ showTrailer: false, trailerUrl: null });
  };

  const getFilteredItems = () => {
    const list = state.content[state.movieTypeFilter + 's'];
    if (!list) return [];
    if (!state.genreFilter) return list;
    return list.filter(item => item.genre_ids && item.genre_ids.includes(state.genreFilter));
  };

  const handleGenreFilter = (genreId) => {
    set({ genreFilter: genreId });
  };

  const handleToggleType = () => {
    set(prev => ({ ...prev, movieTypeFilter: prev.movieTypeFilter === 'movie' ? 'tv' : 'movie' }));
  };

  // When user clicks a movie/show
  const handleItemClick = async (item) => {
    const trailerUrl = await fetchTrailerUrl(item.id, item.media_type || (item.title ? 'movie' : 'tv'));
    if (trailerUrl) handleShowTrailer(trailerUrl);
  };

  // Render functions
  const renderTrailerModal = () => {
    if (!state.showTrailer || !state.trailerUrl) return null;
    return (
      <div className="modal" onClick={handleCloseTrailer}>
        <div className="modal-content" onClick={e => e.stopPropagation()}>
          <button className="close-btn" onClick={handleCloseTrailer}>&times;</button>
          <ReactPlayer url={state.trailerUrl} controls playing width="100%" height="100%" />
        </div>
      </div>
    );
  };

  const renderGenres = () => {
    const genres = state.content.genres || [];
    return (
      <div style={{ display: 'flex', gap: '8px', marginBottom: '16px', overflowX: 'auto' }}>
        <button onClick={() => handleGenreFilter(null)} style={{ padding: '8px', borderRadius: '4px', background: !state.genreFilter ? '#444' : '#222' }}>All</button>
        {genres.map(g => (
          <button key={g.id} onClick={() => handleGenreFilter(g.id)} style={{ padding: '8px', borderRadius: '4px', background: (state.genreFilter === g.id) ? '#444' : '#222' }}>
            {g.name}
          </button>
        ))}
      </div>
    );
  };

  // Main render
  return (
    <div style={{ minHeight: '100vh', background: '#111', color: '#fff', paddingBottom: '40px' }}>
      {/* Navbar */}
      <nav style={{ display: 'flex', justifyContent: 'space-between', padding: '16px', background: '#222' }}>
        <h1 style={{ cursor: 'pointer' }} onClick={() => setState({ view: 'home' })}>Kasenflix</h1>
        <div style={{ display: 'flex', gap: '16px' }}>
          <button style={{ background: 'none', border: 'none', color: '#fff' }} onClick={() => setState({ view: 'home' })}>Home</button>
          <button style={{ background: 'none', border: 'none', color: '#fff' }} onClick={() => setState({ view: 'finder' })}>Finder</button>
          {/* Toggle Movie/TV */}
          <button style={{ background: 'none', border: 'none', color: '#fff' }} onClick={handleToggleType}>
            {`Switch to ${state.movieTypeFilter === 'movie' ? 'TV Shows' : 'Movies'}`}
          </button>
        </div>
      </nav>

      {/* Trailer modal */}
      {renderTrailerModal()}

      {/* Content based on view */}
      {(() => {
        switch (state.view) {
          case 'loading':
            return <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', minHeight: '80vh' }}><div className="spinner"></div></div>;
          case 'auth':
            return (
              <div style={{ padding: '40px', display: 'flex', flexDirection: 'column', alignItems: 'center', height: '80vh', justifyContent: 'center' }}>
                <h2 style={{ marginBottom: '20px' }}>Kasenflix Login</h2>
                <input id="auth-email" placeholder="Email" style={{ marginBottom: '10px', padding: '8px', width: '250px' }} />
                <input id="auth-password" placeholder="Password" type="password" style={{ marginBottom: '10px', padding: '8px', width: '250px' }} />
                {/** Show errors if any */}
                <button style={{ padding: '10px 20px', marginBottom: '10px' }} onClick={handleSignIn}>Sign In</button>
                <button style={{ padding: '10px 20px' }} onClick={handleSignUp}>Sign Up</button>
                <div style={{ marginTop: '10px' }}>
                  <button style={{ padding: '8px', fontSize: '14px' }} onClick={handleGoogleSignIn}>Sign in with Google</button>
                </div>
              </div>
            );
          case 'profile-picker':
            return (
              <div style={{ padding: '40px', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                <h2>Who's Watching?</h2>
                <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap', marginTop: '20px' }}>
                  { /* Profiles */ }
                  {profileButtons(state, setState)}
                </div>
                <button style={{ marginTop: '30px', padding: '10px 20px' }} onClick={() => setState(prev => ({ ...prev, view: 'create-profile' }))}>Create Profile</button>
                <button style={{ marginTop: '10px', padding: '10px 20px' }} onClick={handleSignOut}>Sign Out</button>
              </div>
            );
          case 'create-profile':
            return (
              <div style={{ padding: '40px', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                <h2>Create Profile</h2>
                <input placeholder="Profile Name" value={state.createName} onChange={(e) => setState(prev => ({ ...prev, createName: e.target.value }))} style={{ marginBottom: '10px', padding: '8px', width: '250px' }} />
                <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', marginBottom: '20px' }}>
                  {AVATAR_TEMPLATES.map(url => (
                    <img key={url} src={url} width={80} height={80} style={{ borderRadius: '8px', border: url === state.createAvatar ? '3px solid #f00' : '2px solid transparent', cursor: 'pointer' }} onClick={() => setState(prev => ({ ...prev, createAvatar: url }))} />
                  ))}
                </div>
                <button style={{ padding: '10px 20px', marginBottom: '10px' }} onClick={createProfile}>Save Profile</button>
                <button style={{ padding: '10px 20px' }} onClick={() => setState(prev => ({ ...prev, view: 'profile-picker' }))}>Cancel</button>
              </div>
            );
          case 'home':
            return (
              <div style={{ padding: '20px' }}>
                {/* Genre filters */}
                {renderGenres()}
                {/* Movies/Shows Grid */}
                <div style={{ display: 'grid', gap: '12px', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))' }}>
                  {getFilteredItems().map(item => (
                    <div key={item.id} style={{ cursor: 'pointer', background: '#222', borderRadius: '8px', overflow: 'hidden' }} onClick={() => handleItemClick(item)}>
                      <img src={getPoster(item)} style={{ width: '100%', display: 'block' }} />
                      <div style={{ padding: '8px' }}>
                        <div style={{ fontWeight: 'bold', fontSize: '14px' }}>{getTitle(item)}</div>
                        <div style={{ fontSize: '12px', color: '#888' }}>⭐{(item.vote_average || '?').toFixed(1)}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          case 'finder':
            return (
              <div style={{ padding: '40px', textAlign: 'center' }}>
                <h2>Find a Movie or Show</h2>
                <button onClick={handleFindMovie} style={{ padding: '12px 24px', margin: '20px', background: '#c00', color: '#fff', border: 'none', borderRadius: '8px' }}>Find Me Something</button>
                {/** Show found result */}
                { /* You can add more details or trailer here */ }
              </div>
            );
          default:
            return null;
        }
      })()}
    </div>
  );

  // Profile buttons
  function profileButtons(state, setState) {
    return state.profiles.map(p => (
      <div key={p.id} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', cursor: 'pointer' }} onClick={() => setState(prev => ({ ...prev, activeProfile: p, view: 'home' }))}>
        <img src={p.avatar} width={80} height={80} style={{ borderRadius: '8px', marginBottom: '8px' }} />
        <div style={{ color: '#ccc' }}>{p.name}</div>
      </div>
    ));
  }

  // Fetch trailer URL for a specific movie/show
  async function fetchTrailerUrl(id, media_type) {
    const url = `${TMDB_BASE}/${media_type}/${id}/videos?api_key=${TMDB_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    const trailer = data.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
    if (trailer) {
      return `https://www.youtube.com/watch?v=${trailer.key}`;
    }
    return null;
  }

  // Handle item click: show trailer
  const handleItemClick = async (item) => {
    const trailerUrl = await fetchTrailerUrl(item.id, item.media_type || (item.title ? 'movie' : 'tv'));
    if (trailerUrl) {
      setState(prev => ({ ...prev, trailerUrl, showTrailer: true }));
    } else {
      alert('Trailer not available.');
    }
  };

  // Render trailer modal
  const renderTrailerModal = () => {
    if (!state.showTrailer || !state.trailerUrl) return null;
    return (
      <div className="modal" onClick={handleCloseTrailer}>
        <div className="modal-content" onClick={e => e.stopPropagation()}>
          <button className="close-btn" onClick={handleCloseTrailer}>&times;</button>
          <ReactPlayer url={state.trailerUrl} controls playing width="100%" height="100%" />
        </div>
      </div>
    );
  };

  const handleCloseTrailer = () => {
    setState(prev => ({ ...prev, showTrailer: false, trailerUrl: null }));
  };

  return (
    <>
      {renderTrailerModal()}
    </>
  );
}

// Firebase profile management UI
// (You can implement full profile management UI similar to previous snippets)

const AVATAR_TEMPLATES = [
  "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix",
  "https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka",
  "https://api.dicebear.com/7.x/avataaars/svg?seed=Buddy",
  "https://api.dicebear.com/7.x/avataaars/svg?seed=Max",
  "https://api.dicebear.com/7.x/avataaars/svg?seed=Luna",
  "https://api.dicebear.com/7.x/avataaars/svg?seed=Zara",
];

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
