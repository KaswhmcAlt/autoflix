<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kasenflix - Premium Streaming</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { 
        extend: {
          colors: {
            brand: {
              dark: '#08080c',
              surface: '#0e0e16',
              purple: '#8b5cf6',
              purpleHover: '#7c3aed'
            }
          }
        }
      }
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom Scrollbar Hide */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body {
      background-color: #08080c;
    }
  </style>
</head>
<body class="text-zinc-100 antialiased selection:bg-purple-600 selection:text-white">

  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
      signInWithPopup, GoogleAuthProvider, OAuthProvider, onAuthStateChanged, signOut 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, query, orderBy, limit, getDoc, updateDoc, arrayUnion 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAl6PzNwWQX5accTdcUZ8N7JPQA6NVoH4o",
      authDomain: "log-in-data-f19a9.firebaseapp.com",
      projectId: "log-in-data-f19a9",
      storageBucket: "log-in-data-f19a9.appspot.com",
      messagingSenderId: "546782630442",
      appId: "1:546782630442:web:d8c81d5d8b6512bc82e953"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Expose Firebase services globally for our inline Babel-React app script
    window._firebase = {
      auth, GoogleAuthProvider, OAuthProvider, signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, signInWithPopup, onAuthStateChanged, signOut
    };
    
    window._firebaseReady = true;
    document.dispatchEvent(new Event('firebase-ready'));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TMDB_API_KEY = "70c6183515ac89cbab2dbdea3a6c6124";
    const KASENFLIX_APP_ID = "kasenflix-pro";
    const DEFAULT_AVATAR = "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix";

    // Main App Component Router
    function App() {
      const [fbReady, setFbReady] = useState(false);
      const [user, setUser] = useState(null);
      const [view, setView] = useState('auth'); // auth, home, movies, tv, finder, search
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');

      const [selectedMedia, setSelectedMedia] = useState(null);
      const [playerConfig, setPlayerConfig] = useState({ isOpen: false, item: null, isTrailer: false, season: 1, episode: 1 });

      useEffect(() => {
        const handleFbReady = () => {
          setFbReady(true);
          const { auth, onAuthStateChanged } = window._firebase;
          onAuthStateChanged(auth, (currentUser) => {
            setUser(currentUser);
            if (currentUser) {
              setView('home');
            } else {
              setView('auth');
            }
            setLoading(false);
          });
        };

        if (window._firebaseReady) {
          handleFbReady();
        } else {
          document.addEventListener('firebase-ready', handleFbReady);
        }
        return () => document.removeEventListener('firebase-ready', handleFbReady);
      }, []);

      const handleSearch = (q) => {
        setSearchQuery(q);
        if (q.trim().length > 0) setView('search');
        else setView('home');
      };

      if (loading || !fbReady) {
        return (
          <div className="min-h-screen bg-[#08080c] flex flex-col items-center justify-center">
            <div className="w-16 h-16 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="text-zinc-500 font-semibold tracking-wider uppercase text-xs">Lacing up your library...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#08080c] text-zinc-100 flex flex-col md:flex-row overflow-x-hidden">
          {view === 'auth' ? (
            <AuthScreen />
          ) : (
            <>
              <Sidebar 
                view={view}
                setView={(v) => { setSearchQuery(''); setView(v); }} 
              />
              
              <div className="flex-1 md:pl-20 lg:pl-64 pb-24 md:pb-10 min-h-screen relative w-full overflow-x-hidden">
                <TopBar 
                  user={user}
                  searchQuery={searchQuery}
                  onSearch={handleSearch}
                />
                
                <div className="p-4 md:p-8 lg:p-12 w-full max-w-7xl mx-auto">
                  {view === 'home' && (
                    <HomeScreen 
                      onOpenDetails={setSelectedMedia} 
                      onPlay={(item, s = 1, e = 1) => setPlayerConfig({ isOpen: true, item, isTrailer: false, season: s, episode: e })}
                    />
                  )}
                  {view === 'movies' && (
                    <CatalogScreen 
                      type="movie" 
                      onOpenDetails={setSelectedMedia} 
                      onPlay={(item, s = 1, e = 1) => setPlayerConfig({ isOpen: true, item, isTrailer: false, season: s, episode: e })}
                    />
                  )}
                  {view === 'tv' && (
                    <CatalogScreen 
                      type="tv" 
                      onOpenDetails={setSelectedMedia} 
                      onPlay={(item, s = 1, e = 1) => setPlayerConfig({ isOpen: true, item, isTrailer: false, season: s, episode: e })}
                    />
                  )}
                  {view === 'search' && (
                    <SearchScreen 
                      query={searchQuery} 
                      onOpenDetails={setSelectedMedia} 
                    />
                  )}
                  {view === 'finder' && (
                    <FinderScreen 
                      onPlayTrailer={(item) => setPlayerConfig({ isOpen: true, item, isTrailer: true, season: 1, episode: 1 })} 
                    />
                  )}
                </div>
              </div>
            </>
          )}

          {selectedMedia && (
            <DetailsModal 
              item={selectedMedia} 
              onClose={() => setSelectedMedia(null)} 
              onPlay={(item, s = 1, e = 1) => {
                setSelectedMedia(null);
                setPlayerConfig({ isOpen: true, item, isTrailer: false, season: s, episode: e });
              }}
              onPlayTrailer={(item) => {
                setSelectedMedia(null);
                setPlayerConfig({ isOpen: true, item, isTrailer: true, season: 1, episode: 1 });
              }}
            />
          )}

          {playerConfig.isOpen && (
            <PlayerModal 
              item={playerConfig.item} 
              isTrailer={playerConfig.isTrailer}
              season={playerConfig.season}
              episode={playerConfig.episode}
              onClose={() => setPlayerConfig({ isOpen: false, item: null, isTrailer: false, season: 1, episode: 1 })} 
              onSwapEpisode={(s, e) => setPlayerConfig(prev => ({ ...prev, season: s, episode: e }))}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // 🔐 AUTH SCREEN Component
    // ==========================================
    function AuthScreen() {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

      const handleAuth = async (e) => {
        e.preventDefault();
        setError('');
        const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = window._firebase;
        try {
          if (isLogin) await signInWithEmailAndPassword(auth, email, password);
          else await createUserWithEmailAndPassword(auth, email, password);
        } catch (err) {
          setError(err.message.replace('Firebase: ', ''));
        }
      };

      const handleProviderAuth = async (providerName) => {
        const { auth, signInWithPopup, GoogleAuthProvider, OAuthProvider } = window._firebase;
        try {
          const provider = providerName === 'google' ? new GoogleAuthProvider() : new OAuthProvider('apple.com');
          await signInWithPopup(auth, provider);
        } catch (err) {
          setError(err.message);
        }
      };

      return (
        <div className="min-h-screen w-full relative flex items-center justify-center bg-[#060609] px-4 overflow-hidden">
          <div className="absolute top-[-20%] left-[-20%] w-[60%] h-[60%] rounded-full bg-purple-900/10 blur-[150px] pointer-events-none"></div>
          <div className="absolute bottom-[-20%] right-[-20%] w-[60%] h-[60%] rounded-full bg-indigo-900/10 blur-[150px] pointer-events-none"></div>

          <div className="bg-[#0e0e16]/90 border border-zinc-800 p-8 md:p-12 rounded-2xl shadow-2xl w-full max-w-md backdrop-blur-md z-10">
            <div className="text-center mb-8">
              <div className="text-3xl font-black tracking-tight text-white mb-2">KASEN<span className="text-purple-500">FLIX</span></div>
              <p className="text-zinc-500 text-sm">Elevate your streaming entertainment workspace</p>
            </div>
            
            {error && (
              <div className="bg-red-500/10 border border-red-500/20 text-red-200 p-3 rounded-lg mb-6 text-sm flex items-center gap-2">
                <i data-lucide="shield-alert" className="w-4 h-4 text-red-400"></i>
                <span>{error}</span>
              </div>
            )}
            
            <form onSubmit={handleAuth} className="space-y-4">
              <input 
                type="email" 
                placeholder="Email Address" 
                value={email} 
                onChange={e => setEmail(e.target.value)} 
                required 
                className="w-full bg-[#151522] border border-zinc-800 focus:border-purple-500 text-white px-4 py-3.5 rounded-lg outline-none transition" 
              />
              <input 
                type="password" 
                placeholder="Password" 
                value={password} 
                onChange={e => setPassword(e.target.value)} 
                required 
                className="w-full bg-[#151522] border border-zinc-800 focus:border-purple-500 text-white px-4 py-3.5 rounded-lg outline-none transition" 
              />
              <button type="submit" className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 rounded-lg transition duration-200 shadow-lg shadow-purple-900/20">
                {isLogin ? 'Sign In' : 'Sign Up'}
              </button>
            </form>

            <div className="relative my-6 text-center">
              <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-zinc-800"></div></div>
              <span className="relative bg-[#0e0e16] px-4 text-xs text-zinc-500 uppercase tracking-widest">Or Continue With</span>
            </div>

            <div className="flex gap-3">
              <button onClick={() => handleProviderAuth('google')} className="flex-1 bg-[#151522] border border-zinc-800 hover:border-zinc-700 text-white font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2 text-sm">
                 <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" /><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" /><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" /><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" /></svg>
                 Google
              </button>
              <button onClick={() => handleProviderAuth('apple')} className="flex-1 bg-[#151522] border border-zinc-800 hover:border-zinc-700 text-white font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2 text-sm">
                <svg className="w-4 h-4" viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
                 Apple
              </button>
            </div>

            <p className="mt-8 text-center text-zinc-500 text-sm">
              {isLogin ? "Ready to join the crew? " : "Already have an account? "}
              <span onClick={() => setIsLogin(!isLogin)} className="text-purple-400 font-semibold hover:underline cursor-pointer">
                {isLogin ? "Sign up now" : "Sign in here"}
              </span>
            </p>
          </div>
        </div>
      );
    }

    // ==========================================
    // 🧭 SIDEBAR NAVIGATION Component
    // ==========================================
    function Sidebar({ view, setView }) {
      const { signOut } = window._firebase;
      const menuItems = [
        { id: 'home', label: 'Home', icon: 'home' },
        { id: 'movies', label: 'Movies', icon: 'film' },
        { id: 'tv', label: 'TV Shows', icon: 'tv' },
        { id: 'finder', label: 'Finder', icon: 'compass' }
      ];

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [view]);

      return (
        <>
          <aside className="hidden md:flex flex-col w-20 lg:w-64 fixed top-0 bottom-0 left-0 bg-[#0b0b11] border-r border-zinc-900/80 z-30 py-6 items-center lg:items-start lg:px-6">
            <div className="text-xl font-black tracking-tighter text-white mb-10 flex items-center gap-2 cursor-pointer select-none" onClick={() => setView('home')}>
              <span className="bg-purple-600 text-white p-1 rounded-lg text-sm font-black flex items-center justify-center w-8 h-8">K</span>
              <span className="hidden lg:inline">KASEN<span className="text-purple-500">FLIX</span></span>
            </div>

            <nav className="flex-1 w-full space-y-2">
              {menuItems.map(item => {
                const active = view === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setView(item.id)}
                    className={`w-full flex items-center justify-center lg:justify-start gap-4 px-4 py-3.5 rounded-xl transition-all duration-300 font-semibold group relative ${
                      active 
                        ? 'bg-purple-600/10 text-purple-400 border border-purple-500/20' 
                        : 'text-zinc-500 hover:text-zinc-200 hover:bg-zinc-900/40'
                    }`}
                  >
                    <i data-lucide={item.icon} className={`w-5 h-5 ${active ? 'text-purple-400' : 'text-zinc-500 group-hover:text-zinc-300'}`}></i>
                    <span className="hidden lg:inline text-sm">{item.label}</span>
                    {active && <span className="absolute left-1 top-4 w-1.5 h-3.5 bg-purple-500 rounded-r-md lg:hidden"></span>}
                  </button>
                );
              })}
            </nav>

            <div className="w-full mt-auto">
              <div className="border-t border-zinc-900 pt-4 flex flex-col items-center lg:items-start gap-3">
                <button onClick={() => signOut(window._firebase.auth)} className="flex items-center gap-3 text-zinc-500 hover:text-red-400 transition text-sm font-semibold w-full px-4 py-2">
                  <i data-lucide="log-out" className="w-[18px] h-[18px]"></i>
                  <span className="hidden lg:inline">Logout</span>
                </button>
              </div>
            </div>
          </aside>

          <nav className="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-[#08080c]/90 border-t border-zinc-900 backdrop-blur-lg z-30 flex items-center justify-around px-4">
            {menuItems.map(item => {
              const active = view === item.id;
              return (
                <button key={item.id} onClick={() => setView(item.id)} className={`flex flex-col items-center justify-center p-2 rounded-xl transition ${active ? 'text-purple-400' : 'text-zinc-500'}`}>
                  <i data-lucide={item.icon} className="w-5 h-5"></i>
                  <span className="text-[10px] mt-1 font-bold">{item.label}</span>
                </button>
              );
            })}
          </nav>
        </>
      );
    }

    // ==========================================
    // 🌐 TOP BAR UTILITIES Component
    // ==========================================
    function TopBar({ user, searchQuery, onSearch }) {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [searchQuery]);

      return (
        <div className="w-full px-4 md:px-12 py-4 bg-[#08080c]/40 backdrop-blur-md sticky top-0 z-20 flex items-center justify-between border-b border-zinc-950">
          <div className="md:hidden text-lg font-black tracking-tight text-white flex items-center gap-2">
            <span className="bg-purple-600 text-white p-1 rounded-md text-xs font-black w-6 h-6 flex items-center justify-center">K</span>
            KASEN<span className="text-purple-500">FLIX</span>
          </div>

          <div className="hidden md:flex items-center bg-[#11111b] border border-zinc-800/80 rounded-xl px-4 py-2.5 w-full max-w-md transition-all duration-300 focus-within:border-purple-500/50 focus-within:shadow-[0_0_15px_rgba(139,92,246,0.1)]">
            <i data-lucide="search" className="w-[18px] h-[18px] text-zinc-500 mr-3"></i>
            <input 
              type="text" 
              placeholder="Search movies, TV shows, genres..." 
              value={searchQuery}
              onChange={(e) => onSearch(e.target.value)}
              className="bg-transparent text-white text-sm outline-none w-full placeholder-zinc-500"
            />
          </div>

          <div className="flex items-center gap-4 ml-auto">
            <div className="md:hidden relative bg-[#11111b] border border-zinc-800 rounded-lg flex items-center px-2 py-1 max-w-[150px]">
              <i data-lucide="search" className="w-3.5 h-3.5 text-zinc-500 mr-1.5"></i>
              <input 
                type="text" 
                placeholder="Search..." 
                value={searchQuery}
                onChange={(e) => onSearch(e.target.value)}
                className="bg-transparent text-white text-xs outline-none w-full"
              />
            </div>

            <div className="flex items-center gap-2.5 bg-[#11111b] border border-zinc-800 px-3 py-1.5 rounded-xl">
              <img src={DEFAULT_AVATAR} className="w-6 h-6 rounded-lg object-cover" />
              <span className="text-zinc-300 text-xs font-semibold hidden md:inline">{user?.email?.split('@')[0]}</span>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 🏠 HOME SCREEN Component
    // ==========================================
    function HomeScreen({ onOpenDetails, onPlay }) {
      const [heroData, setHeroData] = useState(null);
      
      const fetchTMDB = async (endpoint) => {
        try {
          const url = `https://api.themoviedb.org/3${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${TMDB_API_KEY}`;
          const res = await fetch(url);
          if (!res.ok) return { results: [] };
          return await res.json();
        } catch { return { results: [] }; }
      };

      useEffect(() => {
        const loadHero = async () => {
          const data = await fetchTMDB('/trending/all/week');
          if (data.results?.length > 0) {
            setHeroData(data.results[Math.floor(Math.random() * Math.min(8, data.results.length))]);
          }
        };
        loadHero();
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [heroData]);

      return (
        <div className="space-y-12">
          {heroData && (
            <div className="relative h-[55vh] md:h-[65vh] rounded-3xl overflow-hidden border border-zinc-900 shadow-2xl">
              <img 
                src={`https://image.tmdb.org/t/p/original${heroData.backdrop_path}`} 
                alt={heroData.title} 
                className="absolute inset-0 w-full h-full object-cover select-none"
              />
              <div className="absolute inset-0 bg-gradient-to-r from-[#08080c] via-[#08080c]/60 to-transparent"></div>
              <div className="absolute inset-0 bg-gradient-to-t from-[#08080c] via-transparent to-transparent"></div>
              
              <div className="absolute bottom-0 left-0 right-0 p-6 md:p-12 z-10 max-w-3xl">
                <span className="bg-purple-600/20 text-purple-400 border border-purple-500/20 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-4 inline-block backdrop-blur-sm">
                  Trending Week
                </span>
                <h1 className="text-3xl md:text-5xl font-black mb-4 tracking-tight text-white leading-tight">
                  {heroData.title || heroData.name}
                </h1>
                <p className="text-sm md:text-base text-zinc-400 line-clamp-3 mb-6 leading-relaxed max-w-xl">
                  {heroData.overview}
                </p>
                <div className="flex flex-wrap gap-4">
                  <button 
                    onClick={() => onPlay({...heroData, type: heroData.media_type || 'movie'})} 
                    className="bg-purple-600 hover:bg-purple-700 text-white font-bold px-6 py-3 rounded-xl flex items-center gap-2 transition shadow-lg shadow-purple-600/15"
                  >
                    <i data-lucide="play" className="w-4 h-4 fill-white"></i> Watch Now
                  </button>
                  <button 
                    onClick={() => onOpenDetails({...heroData, type: heroData.media_type || 'movie'})} 
                    className="bg-zinc-900/80 hover:bg-zinc-800 text-zinc-300 font-bold px-6 py-3 rounded-xl flex items-center gap-2 transition border border-zinc-800"
                  >
                    <i data-lucide="info" className="w-4 h-4"></i> Details
                  </button>
                </div>
              </div>
            </div>
          )}

          <div className="space-y-12">
            <MediaRow title="Top 10 Today's Movies" endpoint="/movie/popular?region=US" onOpenDetails={onOpenDetails} onPlay={onPlay} isTop10 type="movie" />
            <MediaRow title="Top 10 Today's TV Shows" endpoint="/tv/popular?region=US" onOpenDetails={onOpenDetails} onPlay={onPlay} isTop10 type="tv" />
            <MediaRow title="New Releases" endpoint="/trending/all/day" onOpenDetails={onOpenDetails} onPlay={onPlay} />
            <MediaRow title="Futuristic Sci-Fi" endpoint="/discover/movie?with_genres=878" type="movie" onOpenDetails={onOpenDetails} onPlay={onPlay} />
            <MediaRow title="Pulse-Pounding Action" endpoint="/discover/movie?with_genres=28" type="movie" onOpenDetails={onOpenDetails} onPlay={onPlay} />
            <MediaRow title="Binge TV Dramas" endpoint="/discover/tv?with_genres=18" type="tv" onOpenDetails={onOpenDetails} onPlay={onPlay} />
          </div>
        </div>
      );
    }

    // ==========================================
    // 🧩 CATALOG SCREEN Component
    // ==========================================
    function CatalogScreen({ type, onOpenDetails, onPlay }) {
      const [items, setItems] = useState([]);
      const [genres, setGenres] = useState([]);
      const [selectedGenre, setSelectedGenre] = useState('all');

      const fetchTMDB = async (endpoint) => {
        try {
          const url = `https://api.themoviedb.org/3${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${TMDB_API_KEY}`;
          const res = await fetch(url);
          if (!res.ok) return { results: [] };
          return await res.json();
        } catch { return { results: [] }; }
      };

      useEffect(() => {
        const loadCatalog = async () => {
          const gData = await fetchTMDB(`/genre/${type}/list`);
          if (gData.genres) setGenres(gData.genres);

          let discoverPath = `/discover/${type}?sort_by=popularity.desc`;
          if (selectedGenre !== 'all') {
            discoverPath += `&with_genres=${selectedGenre}`;
          }
          const mData = await fetchTMDB(discoverPath);
          setItems((mData.results || []).filter(item => item.poster_path));
        };
        loadCatalog();
      }, [type, selectedGenre]);

      return (
        <div className="space-y-8 animate-fade-in">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h1 className="text-3xl font-black capitalize text-white">Explore {type === 'movie' ? 'Movies' : 'TV Shows'}</h1>
              <p className="text-zinc-500 text-sm mt-1">Browse high quality streams by your favorite genres</p>
            </div>

            <select 
              value={selectedGenre} 
              onChange={(e) => setSelectedGenre(e.target.value)}
              className="bg-[#11111b] border border-zinc-850 text-zinc-300 text-sm px-4 py-2.5 rounded-xl outline-none focus:border-purple-500 max-w-xs transition"
            >
              <option value="all">All Genres</option>
              {genres.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
            </select>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6">
            {items.map(item => (
              <MediaCard key={item.id} item={{...item, type}} onOpenDetails={onOpenDetails} onPlay={onPlay} />
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // 🧩 HOVER MEDIA CARD Component
    // ==========================================
    function MediaCard({ item, onOpenDetails, onPlay, isTop10, index }) {
      const [hovered, setHovered] = useState(false);
      const hoverTimeout = useRef(null);

      const isTV = item.media_type === 'tv' || item.type === 'tv' || item.first_air_date;
      const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
      const year = (item.release_date || item.first_air_date || '').split('-')[0] || 'N/A';
      const lang = (item.original_language || 'EN').toUpperCase();

      const handleMouseEnter = () => {
        hoverTimeout.current = setTimeout(() => {
          setHovered(true);
        }, 350);
      };

      const handleMouseLeave = () => {
        if (hoverTimeout.current) clearTimeout(hoverTimeout.current);
        setHovered(false);
      };

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [hovered]);

      return (
        <div 
          className={`relative select-none shrink-0 ${isTop10 ? 'w-44 md:w-56 flex items-end h-72' : 'w-32 md:w-48 lg:w-56'} aspect-[2/3]`}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
        >
          {isTop10 && !hovered && (
            <span className="absolute left-1 bottom-[-10px] text-[110px] md:text-[140px] font-black tracking-tighter leading-none select-none z-10" style={{ WebkitTextStroke: '2px rgba(139,92,246,0.3)', color: '#08080c' }}>
              {index + 1}
            </span>
          )}

          <div 
            className={`w-full h-full border border-zinc-900 rounded-2xl overflow-hidden relative shadow-lg cursor-pointer ${isTop10 ? 'w-2/3 ml-auto z-20' : ''}`}
            onClick={() => onOpenDetails(item)}
          >
            <img 
              src={`https://image.tmdb.org/t/p/w500${item.poster_path}`} 
              alt={item.title || item.name} 
              className="w-full h-full object-cover rounded-2xl"
              loading="lazy"
            />

            <div className="absolute inset-0 p-3 flex flex-col justify-between pointer-events-none z-10">
              <div className="flex justify-between items-center w-full">
                <span className="bg-black/60 border border-zinc-800 p-1.5 rounded-lg text-white/90 backdrop-blur-sm pointer-events-auto cursor-pointer hover:bg-purple-600 hover:border-purple-500 transition duration-300">
                  <i data-lucide="bookmark" className="w-3.5 h-3.5"></i>
                </span>
                <span className="bg-[#11111b]/80 border border-zinc-800 px-2 py-1 rounded-lg text-yellow-500 font-bold text-xs flex items-center gap-1 backdrop-blur-sm shadow-md">
                  <i data-lucide="star" className="w-3 h-3 fill-yellow-500 text-yellow-500"></i> {rating}
                </span>
              </div>
              <div className="bg-gradient-to-t from-black/90 via-black/40 to-transparent p-2 rounded-b-xl">
                <p className="text-white font-bold text-xs truncate">{item.title || item.name}</p>
                <p className="text-[10px] text-zinc-400 font-medium mt-0.5">{isTV ? 'TV Show' : 'Movie'} / {year} / {lang}</p>
              </div>
            </div>
          </div>

          {hovered && (
            <div 
              className="absolute z-50 bg-[#0e0e16] border border-zinc-800 rounded-3xl overflow-hidden shadow-2xl shadow-black/80 pointer-events-auto"
              style={{
                top: '-20px',
                left: isTop10 ? 'calc(33% - 15px)' : '-20px',
                width: '320px',
                height: 'auto',
              }}
            >
              <div className="relative aspect-video w-full cursor-pointer" onClick={() => onPlay(item, 1, 1)}>
                <img src={`https://image.tmdb.org/t/p/w500${item.backdrop_path || item.poster_path}`} className="w-full h-full object-cover" />
                <div className="absolute inset-0 bg-gradient-to-t from-[#0e0e16] via-[#0e0e16]/30 to-transparent"></div>
                
                <div className="absolute top-3 left-3 right-3 flex justify-between items-center">
                  <span className="bg-black/60 border border-zinc-800 p-1.5 rounded-lg text-white">
                    <i data-lucide="bookmark" className="w-3.5 h-3.5"></i>
                  </span>
                  <span className="bg-[#11111b]/80 border border-zinc-800 px-2.5 py-1 rounded-lg text-yellow-500 font-bold text-xs flex items-center gap-1 backdrop-blur-sm shadow-md">
                    <i data-lucide="star" className="w-3 h-3 fill-yellow-500 text-yellow-500"></i> {rating}
                  </span>
                </div>

                <div className="absolute inset-0 flex items-center justify-center">
                  <div className="bg-purple-600 p-3.5 rounded-full shadow-[0_0_20px_rgba(139,92,246,0.6)]">
                    <i data-lucide="play" className="w-6 h-6 fill-white"></i>
                  </div>
                </div>
              </div>

              <div className="p-5 space-y-4">
                <div className="flex items-center gap-2.5 text-xs font-semibold text-zinc-400">
                  <span className="capitalize text-zinc-300 bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800">{isTV ? 'TV Series' : 'Movie'}</span>
                  <span>&bull;</span>
                  <span>{year}</span>
                  <span>&bull;</span>
                  <span>{lang}</span>
                </div>

                <div className="space-y-1.5">
                  <h4 className="font-black text-white text-lg tracking-tight leading-snug line-clamp-1">{item.title || item.name}</h4>
                  <p className="text-zinc-400 text-xs leading-relaxed line-clamp-3">{item.overview || "No overview script cataloged inside TMDB records."}</p>
                </div>

                <div className="flex items-center gap-2.5 pt-1.5">
                  <button onClick={() => onPlay(item, 1, 1)} className="flex-1 bg-white hover:bg-zinc-200 text-black font-black text-xs uppercase tracking-wider py-3 rounded-xl flex items-center justify-center gap-2 transition duration-300">
                    <i data-lucide="play" className="w-3 h-3 fill-black text-black"></i> Watch Now
                  </button>
                  <button onClick={() => onOpenDetails(item)} className="bg-[#1b1b2a] hover:bg-[#252538] border border-zinc-800 text-white p-3 rounded-xl transition duration-300">
                    <i data-lucide="info" className="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 🧩 MEDIA ROW Component
    // ==========================================
    function MediaRow({ title, endpoint, items: initialItems, type, isTop10, onOpenDetails, onPlay }) {
      const [items, setItems] = useState(initialItems || []);
      const rowRef = useRef(null);
      const [isHovered, setIsHovered] = useState(false);

      useEffect(() => {
        if (initialItems) {
          setItems(initialItems);
          return;
        }
        const fetchData = async () => {
          try {
            const res = await fetch(`https://api.themoviedb.org/3${endpoint}&api_key=${TMDB_API_KEY}`);
            const data = await res.json();
            const validItems = (data.results || []).filter(i => i.poster_path || i.backdrop_path);
            setItems(isTop10 ? validItems.slice(0, 10) : validItems.map(i => ({...i, type: type || i.media_type || 'movie'})));
          } catch (e) { console.error("TMDB Shelf Load error", e); }
        };
        fetchData();
      }, [endpoint, initialItems, type, isTop10]);

      const scroll = (direction) => {
        if (rowRef.current) {
          const { scrollLeft, clientWidth } = rowRef.current;
          const scrollTo = direction === 'left' ? scrollLeft - clientWidth + 100 : scrollLeft + clientWidth - 100;
          rowRef.current.scrollTo({ left: scrollTo, behavior: 'smooth' });
        }
      };

      if (items.length === 0) return null;

      return (
        <div className="relative w-full group/row" onMouseEnter={() => setIsHovered(true)} onMouseLeave={() => setIsHovered(false)}>
          <h2 className="text-lg md:text-xl font-bold text-white mb-4 px-1">{title}</h2>
          
          <button 
            onClick={() => scroll('left')} 
            className={`absolute left-[-16px] top-12 bottom-0 w-12 bg-[#11111b]/80 border border-zinc-850 backdrop-blur-md z-30 flex items-center justify-center opacity-0 ${isHovered ? 'md:opacity-100 hover:bg-[#11111b]' : ''} transition-all duration-300 rounded-2xl h-max py-4 my-auto`}
          >
            <i data-lucide="chevron-left" className="w-6 h-6 text-zinc-300"></i>
          </button>

          <div 
            ref={rowRef} 
            className="w-full flex overflow-x-auto gap-4 px-1 scrollbar-hide py-4"
          >
            {items.map((item, index) => (
              <MediaCard 
                key={item.id} 
                item={item} 
                index={index}
                isTop10={isTop10}
                onOpenDetails={onOpenDetails} 
                onPlay={onPlay} 
              />
            ))}
          </div>

          <button 
            onClick={() => scroll('right')} 
            className={`absolute right-[-16px] top-12 bottom-0 w-12 bg-[#11111b]/80 border border-zinc-850 backdrop-blur-md z-30 flex items-center justify-center opacity-0 ${isHovered ? 'md:opacity-100 hover:bg-[#11111b]' : ''} transition-all duration-300 rounded-2xl h-max py-4 my-auto`}
          >
            <i data-lucide="chevron-right" className="w-6 h-6 text-zinc-300"></i>
          </button>
        </div>
      );
    }

    // ==========================================
    // 🔍 SEARCH SCREEN Component
    // ==========================================
    function SearchScreen({ query, onOpenDetails }) {
      const [results, setResults] = useState([]);

      useEffect(() => {
        if (!query) return;
        const fetchSearch = async () => {
          const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
          const data = await res.json();
          setResults((data.results || []).filter(i => i.poster_path && (i.media_type === 'movie' || i.media_type === 'tv')));
        };
        const debounce = setTimeout(fetchSearch, 300);
        return () => clearTimeout(debounce);
      }, [query]);

      return (
        <div className="space-y-6">
          <h2 className="text-xl text-zinc-400">Search results for: <span className="text-purple-400 font-bold">"{query}"</span></h2>
          {results.length === 0 ? (
            <div className="text-zinc-500 text-sm mt-12 text-center py-20 bg-[#0e0e16]/20 border border-dashed border-zinc-900 rounded-2xl">No matched titles found.</div>
          ) : (
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6">
              {results.map(item => (
                <MediaCard key={item.id} item={{...item, type: item.media_type}} onOpenDetails={onOpenDetails} />
              ))}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 🎲 FINDER SCREEN Component
    // ==========================================
    function FinderScreen({ onPlayTrailer }) {
      const [format, setFormat] = useState('any');
      const [isSpinning, setIsSpinning] = useState(false);

      const executeFinder = async () => {
        setIsSpinning(true);
        try {
          const targetType = format === 'any' ? (Math.random() > 0.5 ? 'movie' : 'tv') : format;
          const randomPage = Math.floor(Math.random() * 250) + 1;
          
          const res = await fetch(`https://api.themoviedb.org/3/discover/${targetType}?api_key=${TMDB_API_KEY}&page=${randomPage}`);
          const data = await res.json();
          
          if (data.results?.length > 0) {
            const item = data.results[Math.floor(Math.random() * data.results.length)];
            item.media_type = targetType;
            setTimeout(() => {
              setIsSpinning(false);
              onPlayTrailer(item);
            }, 1000);
          } else setIsSpinning(false);
        } catch { setIsSpinning(false); }
      };

      return (
        <div className="flex flex-col items-center justify-center min-h-[60vh] relative max-w-2xl mx-auto text-center px-4">
          <div className="absolute w-[80%] h-[80%] rounded-full bg-purple-900/5 blur-[120px] pointer-events-none"></div>

          <h1 className="text-4xl md:text-6xl font-black tracking-tight text-white mb-4">Indecisive?</h1>
          <p className="text-zinc-500 text-base md:text-lg mb-10 max-w-md mx-auto leading-relaxed">
            Let Kasenflix select a high-rated title and **instantly play the trailer** directly in front of you.
          </p>

          <div className="flex bg-[#11111b] border border-zinc-800 p-1 rounded-2xl mb-10 w-max mx-auto shadow-xl">
            {['any', 'movie', 'tv'].map(t => (
              <button 
                key={t}
                onClick={() => setFormat(t)}
                className={`px-6 py-2.5 rounded-xl font-bold uppercase text-xs tracking-wider transition ${format === t ? 'bg-purple-600 text-white shadow' : 'text-zinc-500 hover:text-zinc-300'}`}
              >
                {t === 'any' ? 'Randomize' : t}
              </button>
            ))}
          </div>

          <button 
            onClick={executeFinder}
            disabled={isSpinning}
            className="bg-purple-600 hover:bg-purple-700 disabled:bg-purple-800 text-white font-bold py-5 px-12 rounded-2xl shadow-xl shadow-purple-600/10 transition-all hover:scale-105 active:scale-95 text-lg tracking-wide flex items-center justify-center gap-3 mx-auto"
          >
            {isSpinning ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <i data-lucide="play" className="w-5 h-5 fill-white"></i>}
            {isSpinning ? "Navigating Catalog..." : "Play Instantly"}
          </button>
        </div>
      );
    }

    // ==========================================
    // 📋 DETAILS MODAL Component
    // ==========================================
    function DetailsModal({ item, onClose, onPlay, onPlayTrailer }) {
      const isTV = item.media_type === 'tv' || item.type === 'tv' || item.first_air_date;
      const [tvDetails, setTvDetails] = useState(null);
      const [selectedSeason, setSelectedSeason] = useState(1);
      const [episodes, setEpisodes] = useState([]);
      const [fetchingEpisodes, setFetchingEpisodes] = useState(false);

      useEffect(() => {
        if (!isTV) return;
        const fetchSeriesInfo = async () => {
          try {
            const res = await fetch(`https://api.themoviedb.org/3/tv/${item.id}?api_key=${TMDB_API_KEY}`);
            const data = await res.json();
            setTvDetails(data);
            if (data.seasons && data.seasons.length > 0) {
              const firstAvailableSeason = data.seasons.find(s => s.season_number > 0) || data.seasons[0];
              setSelectedSeason(firstAvailableSeason.season_number);
            }
          } catch (e) { console.error("Error loading series metadata:", e); }
        };
        fetchSeriesInfo();
      }, [item, isTV]);

      useEffect(() => {
        if (!isTV || !selectedSeason) return;
        const loadEpisodes = async () => {
          setFetchingEpisodes(true);
          try {
            const res = await fetch(`https://api.themoviedb.org/3/tv/${item.id}/season/${selectedSeason}?api_key=${TMDB_API_KEY}`);
            const data = await res.json();
            setEpisodes(data.episodes || []);
          } catch (e) { console.error("Error loading season episodes:", e); }
          setFetchingEpisodes(false);
        };
        loadEpisodes();
      }, [isTV, selectedSeason, item.id]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [tvDetails, episodes, fetchingEpisodes]);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md overflow-y-auto animate-fade-in">
          <div className="relative w-full max-w-4xl bg-[#0e0e16] rounded-3xl shadow-2xl border border-zinc-850 max-h-[90vh] overflow-y-auto">
            <button onClick={onClose} className="absolute top-5 right-5 z-20 bg-zinc-900/60 text-white p-2.5 rounded-full hover:bg-zinc-800 transition backdrop-blur-sm border border-zinc-800/50">
              <i data-lucide="x" className="w-5 h-5"></i>
            </button>

            <div className="relative w-full h-[45vh] shrink-0">
              <img src={`https://image.tmdb.org/t/p/original${item.backdrop_path || item.poster_path}`} className="w-full h-full object-cover select-none" />
              <div className="absolute inset-0 bg-gradient-to-t from-[#0e0e16] to-transparent"></div>
              
              <div className="absolute bottom-8 left-6 right-6 md:left-12">
                <h2 className="text-3xl md:text-5xl font-black text-white mb-6 tracking-tight leading-none">{item.title || item.name}</h2>
                <div className="flex flex-wrap gap-3">
                  <button onClick={() => onPlay({...item, type: isTV ? 'tv' : 'movie'}, 1, 1)} className="bg-purple-600 text-white px-8 py-3 rounded-xl font-bold flex items-center gap-2 hover:bg-purple-700 transition shadow-lg shadow-purple-600/10 text-sm">
                    <i data-lucide="play" className="w-4 h-4 fill-white"></i> Play S1:E1
                  </button>
                  <button onClick={() => onPlayTrailer({...item, type: isTV ? 'tv' : 'movie'})} className="bg-zinc-950/80 text-zinc-300 px-8 py-3 rounded-xl font-bold flex items-center gap-2 hover:bg-zinc-800 transition border border-zinc-800 text-sm">
                    Watch Promo
                  </button>
                </div>
              </div>
            </div>

            <div className="p-6 md:p-12 space-y-8">
              <div className="flex flex-col md:flex-row gap-8">
                <div className="md:w-2/3">
                  <div className="flex items-center gap-3 text-xs font-bold mb-4 uppercase tracking-widest text-zinc-500">
                    <span className="text-green-500">{Math.round((item.vote_average || 0) * 10)}% Match</span>
                    <span>&bull;</span>
                    <span>{item.release_date?.split('-')[0] || item.first_air_date?.split('-')[0]}</span>
                    <span>&bull;</span>
                    <span className="border border-zinc-850 px-2 py-0.5 rounded text-zinc-400">{isTV ? 'TV Series' : 'Movie'}</span>
                  </div>
                  <p className="text-zinc-400 text-base md:text-lg leading-relaxed">{item.overview}</p>
                </div>
                <div className="md:w-1/3 flex flex-col gap-4 text-xs font-semibold bg-[#11111b] border border-zinc-850 p-6 rounded-2xl h-max">
                  <div><span className="text-zinc-500 block mb-1">Total Hits:</span> <span className="text-zinc-300 text-sm font-bold">{item.popularity?.toFixed(0)}</span></div>
                  <div><span className="text-zinc-500 block mb-1">Language Track:</span> <span className="text-zinc-300 text-sm uppercase font-bold">{item.original_language}</span></div>
                </div>
              </div>

              {isTV && tvDetails && (
                <div className="border-t border-zinc-900 pt-8 space-y-6">
                  <div className="flex items-center justify-between">
                    <h3 className="text-xl font-black text-white">Episodes List</h3>
                    <select 
                      value={selectedSeason} 
                      onChange={(e) => setSelectedSeason(Number(e.target.value))}
                      className="bg-[#11111b] border border-zinc-850 text-zinc-300 text-sm px-4 py-2 rounded-xl outline-none focus:border-purple-500 transition"
                    >
                      {tvDetails.seasons && tvDetails.seasons
                        .filter(s => s.season_number > 0)
                        .map(season => (
                          <option key={season.id} value={season.season_number}>
                            {season.name} ({season.episode_count} Episodes)
                          </option>
                        ))
                      }
                    </select>
                  </div>

                  {fetchingEpisodes ? (
                    <div className="flex items-center justify-center py-12">
                      <div className="w-8 h-8 border-2 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {episodes.map(ep => (
                        <div key={ep.id} className="bg-[#11111b] border border-zinc-850 rounded-2xl overflow-hidden p-4 flex gap-4 hover:border-purple-500/50 transition duration-300 group">
                          <div className="relative w-28 h-18 bg-zinc-900 rounded-lg overflow-hidden shrink-0 aspect-video">
                            {ep.still_path ? (
                              <img src={`https://image.tmdb.org/t/p/w300${ep.still_path}`} className="w-full h-full object-cover" />
                            ) : (
                              <div className="w-full h-full flex items-center justify-center text-zinc-700 font-bold text-xs bg-zinc-950">No Cover</div>
                            )}
                            <button 
                              onClick={() => onPlay(item, selectedSeason, ep.episode_number)}
                              className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-all duration-300"
                            >
                              <i data-lucide="play" className="w-6 h-6 fill-purple-500 text-purple-500"></i>
                            </button>
                          </div>
                          <div className="flex-1 min-w-0 flex flex-col justify-center">
                            <h4 className="font-bold text-sm text-white truncate group-hover:text-purple-400 transition">
                              {ep.episode_number}. {ep.name}
                            </h4>
                            <p className="text-[11px] text-zinc-500 line-clamp-2 mt-1 leading-relaxed">{ep.overview || "No overview listed for this episode."}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 🍿 PLAYER MODAL Component
    // ==========================================
    function PlayerModal({ item, isTrailer, season, episode, onClose, onSwapEpisode }) {
      const [loading, setLoading] = useState(true);
      const [trailerKey, setTrailerKey] = useState(null);
      const [activeServer, setActiveServer] = useState('server1');
      const [playerEpisodes, setPlayerEpisodes] = useState([]);
      const isTV = item.type === 'tv' || item.media_type === 'tv' || item.first_air_date;

      useEffect(() => {
        const initPlayer = async () => {
          setLoading(true);
          if (isTrailer) {
            try {
              const res = await fetch(`https://api.themoviedb.org/3/${item.media_type || item.type || 'movie'}/${item.id}/videos?api_key=${TMDB_API_KEY}`);
              const data = await res.json();
              const tr = data.results?.find(v => v.type === 'Trailer' && v.site === 'YouTube') || data.results?.find(v => v.site === 'YouTube');
              setTrailerKey(tr ? tr.key : 'error');
            } catch { setTrailerKey('error'); }
          } else if (isTV) {
            try {
              const res = await fetch(`https://api.themoviedb.org/3/tv/${item.id}/season/${season}?api_key=${TMDB_API_KEY}`);
              const data = await res.json();
              setPlayerEpisodes(data.episodes || []);
            } catch (e) { console.error("Error fetching runtime playlist collection:", e); }
          }
          setLoading(false);
        };
        initPlayer();
      }, [item, isTrailer, season]);

      const getEmbedUrl = () => {
        if (isTrailer) {
          return `https://www.youtube.com/embed/${trailerKey}?autoplay=1&rel=0&modestbranding=1`;
        }
        const type = isTV ? 'tv' : 'movie';
        
        if (activeServer === 'server1') {
          const path = type === 'tv' ? `tv/${item.id}/${season}/${episode}` : `movie/${item.id}`;
          return `https://player.vidplus.to/embed/${path}?autoplay=true&poster=true&title=true&download=true&chromecast=true&servericon=true&setting=true&pip=true&icons=netflix&primarycolor=8b5cf6&secondarycolor=4c1d95&iconcolor=FFFFFF&font=Roboto&fontcolor=FFFFFF&fontsize=20&opacity=0.5`;
        } else if (activeServer === 'server2') {
          return type === 'tv' 
            ? `https://embedmaster.link/rvyn5y7vbe4k8862/tv/${item.id}/${season}/${episode}`
            : `https://embedmaster.link/rvyn5y7vbe4k8862/movie/${item.id}`;
        } else {
          return type === 'tv'
            ? `https://vidlink.pro/tv/${item.id}/${season}/${episode}`
            : `https://vidlink.pro/movie/${item.id}`;
        }
      };

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeServer, loading, playerEpisodes, episode]);

      return (
        <div className="fixed inset-0 z-[100] bg-[#060609] flex flex-col md:flex-row animate-fade-in">
          
          {/* LEFT CONTROLS PANEL */}
          <div className="w-full md:w-80 bg-[#0e0e16] border-b md:border-b-0 md:border-r border-zinc-900 p-6 flex flex-col justify-between z-20 overflow-y-auto shrink-0">
            <div className="space-y-6">
              <button onClick={onClose} className="text-zinc-400 hover:text-white flex items-center gap-2 transition group font-bold">
                <i data-lucide="arrow-left" className="w-5 h-5 group-hover:-translate-x-1 transition duration-300"></i>
                <span>Close Player</span>
              </button>

              <div className="border-t border-zinc-900 pt-6">
                <span className="text-zinc-500 font-bold uppercase text-[10px] tracking-wider block mb-2">Streaming Now</span>
                <h2 className="text-white text-xl font-black tracking-tight">{item.title || item.name}</h2>
                <p className="text-xs text-zinc-500 mt-1 capitalize">{isTV ? 'TV Show' : 'Movie'}</p>
                {isTV && (
                  <p className="text-xs text-purple-400 font-bold mt-1">Season {season} &bull; Episode {episode}</p>
                )}
              </div>

              {/* SERVER OPTIONS LIST */}
              {!isTrailer && (
                <div className="space-y-3">
                  <span className="text-zinc-500 font-bold uppercase text-[10px] tracking-wider block">Select Audio/Server</span>
                  
                  <button 
                    onClick={() => setActiveServer('server1')}
                    className={`w-full text-left p-3.5 rounded-xl border flex items-center justify-between font-bold text-sm transition-all ${activeServer === 'server1' ? 'bg-purple-600/10 border-purple-500/50 text-purple-400 shadow-lg' : 'bg-[#11111b] border-zinc-850 text-zinc-400 hover:border-zinc-800'}`}
                  >
                    <div className="flex items-center gap-3"><i data-lucide="server" className="w-4 h-4"></i><span>VidPlus Premium</span></div>
                    <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase bg-purple-500/20 text-purple-400">Fast</span>
                  </button>

                  <button 
                    onClick={() => setActiveServer('server2')}
                    className={`w-full text-left p-3.5 rounded-xl border flex items-center justify-between font-bold text-sm transition-all ${activeServer === 'server2' ? 'bg-purple-600/10 border-purple-500/50 text-purple-400 shadow-lg' : 'bg-[#11111b] border-zinc-850 text-zinc-400 hover:border-zinc-800'}`}
                  >
                    <div className="flex items-center gap-3"><i data-lucide="server" className="w-4 h-4"></i><span>EmbedMaster HD</span></div>
                    <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase bg-purple-500/20 text-purple-400">VIP</span>
                  </button>

                  <button 
                    onClick={() => setActiveServer('server3')}
                    className={`w-full text-left p-3.5 rounded-xl border flex items-center justify-between font-bold text-sm transition-all ${activeServer === 'server3' ? 'bg-purple-600/10 border-purple-500/50 text-purple-400 shadow-lg' : 'bg-[#11111b] border-zinc-850 text-zinc-400 hover:border-zinc-800'}`}
                  >
                    <div className="flex items-center gap-3"><i data-lucide="server" className="w-4 h-4"></i><span>VidLink Pro</span></div>
                    <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase bg-purple-500/20 text-purple-400">HD</span>
                  </button>
                </div>
              )}
            </div>

            {/* LIVE EPISODE SWITCHER PANEL GRID inside Sidepanel */}
            {isTV && !isTrailer && playerEpisodes.length > 0 && (
              <div className="mt-6 border-t border-zinc-900 pt-6 flex-1 flex flex-col min-h-[220px] max-h-[350px]">
                <span className="text-zinc-500 font-bold uppercase text-[10px] tracking-wider block mb-3">Episodes List</span>
                <div className="flex-1 overflow-y-auto space-y-2 pr-1 scrollbar-hide">
                  {playerEpisodes.map(ep => {
                    const isActive = ep.episode_number === episode;
                    return (
                      <div 
                        key={ep.id} 
                        onClick={() => !isActive && onSwapEpisode(season, ep.episode_number)}
                        className={`p-2.5 rounded-xl border text-xs cursor-pointer flex items-center gap-3 transition-all ${isActive ? 'bg-purple-600 text-white border-purple-500 font-bold' : 'bg-[#11111b] border-zinc-850 text-zinc-400 hover:border-zinc-800'}`}
                      >
                        <span className={`w-6 h-6 rounded-lg flex items-center justify-center text-[11px] font-black shrink-0 ${isActive ? 'bg-white/20 text-white' : 'bg-zinc-900 text-zinc-500'}`}>
                          {ep.episode_number}
                        </span>
                        <span className="truncate flex-1 font-medium">{ep.name || `Episode ${ep.episode_number}`}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            <div className="hidden md:flex items-center gap-3 bg-[#11111b] border border-zinc-850 p-4 rounded-2xl text-xs text-zinc-500 mt-4 leading-relaxed shrink-0">
              <i data-lucide="volume-2" className="text-purple-400 shrink-0"></i>
              <span>If player lags, switch servers to automatically change sources instantly!</span>
            </div>
          </div>

          {/* MIDDLE STREAM IFRAME VIEWPORT CONTAINER */}
          <div className="flex-1 relative bg-black w-full h-full flex items-center justify-center">
            {loading ? (
               <div className="w-16 h-16 border-4 border-zinc-800 border-t-purple-500 rounded-full animate-spin"></div>
            ) : isTrailer && trailerKey === 'error' ? (
               <div className="text-center text-zinc-500 max-w-sm px-4">
                 <i data-lucide="search" className="mx-auto mb-4 text-zinc-700 w-12 h-12"></i>
                 <h2 className="text-xl font-bold text-white mb-2">Trailer Unavailable</h2>
                 <p className="text-sm leading-relaxed">No promotional trailer tracks could be found inside the TMDB index for this title.</p>
               </div>
            ) : (
               <iframe 
                 src={getEmbedUrl()}
                 className="w-full h-full border-none absolute inset-0"
                 allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
                 allowFullScreen
               ></iframe>
            )}
          </div>

        </div>
      );
    }

    // Render App Root
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
