<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kasenflix</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, OAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAl6PzNwWQX5accTdcUZ8N7JPQA6NVoH4o",
      authDomain: "log-in-data-f19a9.firebaseapp.com",
      projectId: "log-in-data-f19a9",
      storageBucket: "log-in-data-f19a9.appspot.com",
      messagingSenderId: "546782630442",
      appId: "1:546782630442:web:d8c81d5d8b6512bc82e953"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);

    window._kfAuth = auth;
    window._kfDb = db;
    window._kfAppId = 'kasenflix-pro';
    window._kfFirebase = { signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, OAuthProvider, onAuthStateChanged, signOut, doc, setDoc, deleteDoc, collection, onSnapshot, updateDoc };
    window._kfReady = true;
    document.dispatchEvent(new Event('firebase-ready'));
  </script>

  <style>
    :root {
      --primary: #00f5ff;
      --accent: #ff00aa;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0a0a; color:#fff; font-family:'Segoe UI', system-ui, sans-serif; overflow-x:hidden; }
    h1, h2, h3 { font-weight:900; letter-spacing:-0.04em; }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(10,10,10,0.95), transparent);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px);
    }
    .logo { font-size: 28px; font-weight: 900; background: linear-gradient(90deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor:pointer; }

    .nav-links button {
      background:none; border:none; color:#ccc; font-size:15px; padding:8px 20px; border-radius:9999px; transition:all 0.3s;
    }
    .nav-links button.active, .nav-links button:hover {
      background:rgba(0,245,255,0.15); color:var(--primary);
    }

    /* Hero */
    .hero {
      height: 85vh;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 0 24px 80px;
    }
    .hero-bg { position:absolute; inset:0; object-fit:cover; filter:brightness(0.65); }
    .hero-content { max-width: 600px; z-index: 2; }

    /* Content Rows */
    .row {
      padding: 20px 24px;
      margin-top: -60px;
      position: relative;
      z-index: 10;
    }
    .row-title {
      font-size: 22px;
      margin-bottom: 12px;
      padding-left: 8px;
    }
    .scroll-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 0;
      scrollbar-width: none;
    }
    .scroll-row::-webkit-scrollbar { display:none; }
    .card {
      min-width: 180px;
      aspect-ratio: 2/3;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
      position: relative;
    }
    .card:hover {
      transform: scale(1.08) translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,245,255,0.3);
    }
    .card img { width:100%; height:100%; object-fit:cover; }

    /* Player */
    .player-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .player-content {
      width: 95%;
      max-width: 1100px;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
    }
    .close-player {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 10;
    }

    /* Finder */
    .finder {
      padding: 120px 24px 80px;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="root"></div>

<script>
// ================== CONFIG ==================
const TMDB_KEY = '70c6183515ac89cbab2dbdea3a6c6124';
const IMG_BASE = 'https://image.tmdb.org/t/p/w500';
const BACKDROP_BASE = 'https://image.tmdb.org/t/p/original';

let state = {
  user: null,
  profiles: [],
  activeProfile: null,
  view: 'loading',
  currentTab: 'home',
  content: { trending: [], movies: [], tv: [] },
  hero: null,
  selectedItem: null,
  playerUrl: null,
  finderType: 'movie',
  finderGenre: '',
};

// ================== HELPERS ==================
function getPoster(item) { return item?.poster_path ? `${IMG_BASE}${item.poster_path}` : ''; }
function getBackdrop(item) { return item?.backdrop_path ? `${BACKDROP_BASE}${item.backdrop_path}` : ''; }
function getTitle(item) { return item?.title || item?.name || 'Untitled'; }

// ================== TMDB ==================
async function fetchContent() {
  if (state.content.trending.length) return;
  const [tr, mr, tv] = await Promise.all([
    fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_KEY}`),
    fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_KEY}`),
    fetch(`https://api.themoviedb.org/3/tv/popular?api_key=${TMDB_KEY}`)
  ]);
  const [tData, mData, tvData] = await Promise.all([tr.json(), mr.json(), tv.json()]);
  
  state.content = {
    trending: tData.results,
    movies: mData.results,
    tv: tvData.results
  };
  state.hero = tData.results[0];
  render();
}

// ================== PLAYER ==================
function playItem(item) {
  state.selectedItem = item;
  const title = getTitle(item);
  
  // Try to get trailer
  fetch(`https://api.themoviedb.org/3/${item.media_type || (item.title ? 'movie' : 'tv')}/${item.id}/videos?api_key=${TMDB_KEY}`)
    .then(r => r.json())
    .then(data => {
      const trailer = data.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
      state.playerUrl = trailer ? `https://www.youtube.com/embed/${trailer.key}?autoplay=1` : 
        `https://www.youtube.com/results?search_query=${encodeURIComponent(title + ' trailer')}`;
      
      render();
      document.getElementById('player-modal').style.display = 'flex';
    });
}

function closePlayer() {
  document.getElementById('player-modal').style.display = 'none';
  state.playerUrl = null;
}

// ================== FINDER ==================
function findSomething() {
  let pool = state.finderType === 'movie' ? state.content.movies : state.content.tv;
  if (state.finderGenre) {
    pool = pool.filter(item => item.genre_ids && item.genre_ids.includes(parseInt(state.finderGenre)));
  }
  if (!pool.length) return alert("No results in that category yet.");
  
  const random = pool[Math.floor(Math.random() * pool.length)];
  playItem(random);
}

// ================== RENDER ==================
function render() {
  const root = document.getElementById('root');
  let html = '';

  if (state.view === 'loading' || state.view === 'auth') {
    html = `<div style="height:100vh;background:#000;display:flex;align-items:center;justify-content:center;"><div style="width:50px;height:50px;border:4px solid #00f5ff;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></div></div>`;
  } 
  else if (state.view === 'profile-picker') {
    // (Keep your existing profile picker logic or simplify)
    html = `<div style="height:100vh;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <h1 style="font-size:48px;margin-bottom:40px;">Who's watching?</h1>
      <div style="display:flex;gap:30px;flex-wrap:wrap;justify-content:center;">
        ${state.profiles.map(p => `
          <div onclick="selectProfile(${JSON.stringify(p).replace(/"/g,"'")})" style="text-align:center;cursor:pointer;">
            <img src="${p.avatar}" style="width:140px;height:140px;border-radius:16px;border:4px solid #00f5ff;" />
            <p style="margin-top:12px;font-size:20px;">${p.name}</p>
          </div>
        `).join('')}
      </div>
    </div>`;
  } 
  else {
    // MAIN APP
    html = `
    <nav class="navbar">
      <div class="logo" onclick="setState({view:'home', currentTab:'home'})">KASENFLIX</div>
      <div class="nav-links">
        <button class="${state.currentTab==='home'?'active':''}" onclick="setTab('home')">Home</button>
        <button class="${state.currentTab==='movies'?'active':''}" onclick="setTab('movies')">Movies</button>
        <button class="${state.currentTab==='tv'?'active':''}" onclick="setTab('tv')">TV Shows</button>
        <button class="${state.currentTab==='finder'?'active':''}" onclick="setTab('finder')">Finder</button>
      </div>
      <div onclick="setState({view:'profile-picker'})" style="cursor:pointer;">
        ${state.activeProfile ? `<img src="${state.activeProfile.avatar}" style="width:40px;height:40px;border-radius:50%;border:2px solid #00f5ff;">` : ''}
      </div>
    </nav>

    ${state.currentTab === 'home' || state.currentTab === 'movies' || state.currentTab === 'tv' ? `
    <div class="hero">
      ${state.hero ? `<img class="hero-bg" src="${getBackdrop(state.hero)}" />` : ''}
      <div class="hero-content">
        <h1 style="font-size:clamp(40px,8vw,80px);line-height:1;">${getTitle(state.hero)}</h1>
        <div style="margin:16px 0;display:flex;gap:16px;">
          <button onclick="playItem(state.hero)" style="background:var(--primary);color:#000;padding:14px 32px;border:none;border-radius:9999px;font-weight:bold;font-size:18px;">▶ Play</button>
        </div>
      </div>
    </div>` : ''}

    <div class="row">
      ${renderRows()}
    </div>

    <!-- PLAYER MODAL -->
    <div id="player-modal" class="player-modal">
      <div class="player-content">
        <button class="close-player" onclick="closePlayer()">✕</button>
        ${state.playerUrl ? `
          <iframe width="100%" height="620" src="${state.playerUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        ` : ''}
      </div>
    </div>`;
  }

  root.innerHTML = html;
}

function renderRows() {
  let items = [];
  let title = '';

  if (state.currentTab === 'home') {
    return `
      <div class="row"><h2 class="row-title">🔥 Trending Now</h2><div class="scroll-row">${renderCards(state.content.trending)}</div></div>
      <div class="row"><h2 class="row-title">🎬 Popular Movies</h2><div class="scroll-row">${renderCards(state.content.movies)}</div></div>
      <div class="row"><h2 class="row-title">📺 Popular TV Shows</h2><div class="scroll-row">${renderCards(state.content.tv)}</div></div>
    `;
  }
  if (state.currentTab === 'movies') {
    return `<div class="row"><h2 class="row-title">Movies</h2><div class="scroll-row">${renderCards(state.content.movies)}</div></div>`;
  }
  if (state.currentTab === 'tv') {
    return `<div class="row"><h2 class="row-title">TV Shows</h2><div class="scroll-row">${renderCards(state.content.tv)}</div></div>`;
  }
  return '';
}

function renderCards(items) {
  return items.map(item => `
    <div class="card" onclick='playItem(${JSON.stringify(item)})' >
      <img src="${getPoster(item)}" alt="${getTitle(item)}" />
    </div>
  `).join('');
}

function setTab(tab) {
  state.currentTab = tab;
  fetchContent();
  render();
}

// Expose functions
window.setState = (patch) => { Object.assign(state, patch); render(); };
window.selectProfile = (p) => { state.activeProfile = p; state.view = 'home'; fetchContent(); render(); };
window.setTab = setTab;
window.playItem = playItem;
window.closePlayer = closePlayer;
window.findSomething = findSomething;

// Boot
setState({view: 'profile-picker'});
fetchContent();
</script>
</body>
</html>
