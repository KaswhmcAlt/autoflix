<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasenflix - Premium Streaming</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* --- CSS THEME VARIABLES (Now Blue!) --- */
        :root {
            --bg-main: #0a0f1d;          /* Ultra-dark blue background */
            --bg-card: #141b2d;          /* Slightly lighter blue for movie cards */
            --accent-blue: #0070f3;      /* Vibrant primary blue */
            --accent-glow: rgba(0, 112, 243, 0.4);
            --text-main: #ffffff;
            --text-muted: #8a99ad;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- 🛠️ INFINITE LOADING SCREEN FIX --- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        /* Blue Loading Spinner */
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px var(--accent-glow);
            margin-bottom: 20px;
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- MAIN INTERFACE LAYOUT --- */
        header {
            padding: 20px 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(10,15,29,0.8), transparent);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: var(--accent-blue);
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .main-layout {
            padding: 100px 4% 40px 4%;
            min-height: 100vh;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-blue);
            padding-left: 10px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px var(--accent-glow);
            border-color: var(--accent-blue);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            background-color: #1a233d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-align: center;
            padding: 10px;
        }

        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-info {
            padding: 12px;
        }

        .movie-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Lacing up your library...</div>
    </div>

    <header>
        <div class="logo">Kasenflix</div>
    </header>

    <main class="main-layout">
        <h2>Trending Now</h2>
        <div class="movie-grid" id="movie-library">
            </div>
    </main>

    <script>
        // ==========================================
        // 🔑 CONFIGURATION (Replace with your keys)
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const TMDB_API_KEY = 'YOUR_TMDB_API_KEY'; 
        const TMDB_ENDPOINT = `https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_API_KEY}`;

        // Initialize Firebase safely
        let app, auth;
        try {
            if (firebaseConfig.apiKey !== "YOUR_FIREBASE_API_KEY") {
                app = firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
            }
        } catch (error) {
            console.error("Firebase initialization failed:", error);
        }

        // ==========================================
        // 🚀 CORE LOGIC & LIFECYCLE CONTROLLER
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            if (auth) {
                // Monitor user auth state
                auth.onAuthStateChanged((user) => {
                    console.log("Auth state verified.");
                    initLibrary();
                }, (error) => {
                    console.error("Auth observer error:", error);
                    initLibrary(); // Fallback so page doesn't break
                });
            } else {
                // No Firebase configured yet, load layout directly
                console.warn("Running without live Firebase configuration.");
                initLibrary();
            }
        });

        // Fetch data from TMDB and break the infinite load state
        async function initLibrary() {
            const libraryContainer = document.getElementById('movie-library');
            
            try {
                if (TMDB_API_KEY === 'YOUR_TMDB_API_KEY') {
                    throw new Error("Placeholder API keys active.");
                }

                const response = await fetch(TMDB_ENDPOINT);
                if (!response.ok) throw new Error("API Network response issue.");
                
                const data = await response.json();
                renderMovies(data.results);

            } catch (error) {
                console.warn("Using interface visual fallback:", error.message);
                renderFallbackUI();
            } finally {
                // 🛑 CRITICAL FIX: Always hides loader window, no matter what crashes
                hideLoadingScreen();
            }
        }

        // Render live TMDB movie cards
        function renderMovies(movies) {
            const container = document.getElementById('movie-library');
            container.innerHTML = '';
            
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="movie-poster">
                        <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}" onerror="this.style.display='none'">
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Visual layout sandbox if API keys are missing or offline
        function renderFallbackUI() {
            const container = document.getElementById('movie-library');
            container.innerHTML = '';
            
            // Dummy items to test your new blue design right away
            for (let i = 1; i <= 6; i++) {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="movie-poster">🎬 Setup Key to Load Assets</div>
                    <div class="movie-info">
                        <div class="movie-title">Demo Dashboard Item ${i}</div>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function hideLoadingScreen() {
            const loader = document.getElementById('loading-screen');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.visibility = 'hidden';
            }, 500); // Smooth fade-out duration
        }
    </script>
</body>
</html>
