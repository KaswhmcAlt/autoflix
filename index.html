// ============================================================
// HELPERS
// ============================================================
function getTitle(item) { return item?.title || item?.name || 'Untitled'; }
function getPoster(item) { return item?.poster_path ? `${IMG_BASE}${item.poster_path}` : null; }
function getBackdrop(item) { return item?.backdrop_path ? `${BACKDROP_BASE}${item.backdrop_path}` : null; }

// ============================================================
// FIREBASE ACTIONS
// ============================================================
function waitForFirebase(cb) {
  if (window._kfReady) cb();
  else document.addEventListener('firebase-ready', cb, { once: true });
}

function initFirebase() {
  waitForFirebase(() => {
    const { onAuthStateChanged } = window._kfFirebase;
    const auth = window._kfAuth;
    onAuthStateChanged(auth, (u) => {
      if (!u) {
        if (state.unsubProfiles) { state.unsubProfiles(); state.unsubProfiles = null; }
        setState({ user: null, profiles: [], activeProfile: null, view: 'auth' });
      } else {
        setState({ user: u });
        subscribeProfiles(u.uid);
        if (state.view === 'loading' || state.view === 'auth') setState({ view: 'profile-picker' });
      }
    });
  });
}

function subscribeProfiles(uid) {
  if (state.unsubProfiles) state.unsubProfiles();
  waitForFirebase(() => {
    const { collection, onSnapshot } = window._kfFirebase;
    const db = window._kfDb;
    const appId = window._kfAppId;
    const ref = collection(db, 'artifacts', appId, 'users', uid, 'profiles');
    const unsub = onSnapshot(ref, (snap) => {
      const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      setState({ profiles: list });
    });
    state.unsubProfiles = unsub;
  });
}

async function handleSignIn() {
  const email = document.getElementById('auth-email')?.value || '';
  const password = document.getElementById('auth-password')?.value || '';
  setState({ authError: '' });
  try {
    const { signInWithEmailAndPassword } = window._kfFirebase;
    await signInWithEmailAndPassword(window._kfAuth, email, password);
    setState({ view: 'profile-picker' });
  } catch(e) {
    setState({ authError: e.message.replace('Firebase: ','').replace(/\(auth.*\)\.?/,'') });
  }
}

async function handleSignUp() {
  const email = document.getElementById('auth-email')?.value || '';
  const password = document.getElementById('auth-password')?.value || '';
  setState({ authError: '' });
  try {
    const { createUserWithEmailAndPassword } = window._kfFirebase;
    await createUserWithEmailAndPassword(window._kfAuth, email, password);
    setState({ view: 'profile-picker' });
  } catch(e) {
    setState({ authError: e.message.replace('Firebase: ','').replace(/\(auth.*\)\.?/,'') });
  }
}

async function handleGoogleSignIn() {
  setState({ authError: '' });
  try {
    const { signInWithPopup, GoogleAuthProvider } = window._kfFirebase;
    await signInWithPopup(window._kfAuth, new GoogleAuthProvider());
    setState({ view: 'profile-picker' });
  } catch(e) { setState({ authError: 'Google sign-in failed. Try again.' }); }
}

async function handleAppleSignIn() {
  setState({ authError: '' });
  try {
    const { signInWithPopup, OAuthProvider } = window._kfFirebase;
    const provider = new OAuthProvider('apple.com');
    await signInWithPopup(window._kfAuth, provider);
    setState({ view: 'profile-picker' });
  } catch(e) { setState({ authError: 'Apple sign-in failed. Try again.' }); }
}

async function handleSignOut() {
  const { signOut } = window._kfFirebase;
  await signOut(window._kfAuth);
  setState({ user: null, activeProfile: null, view: 'auth' });
}

async function createProfile() {
  const name = state.createName.trim();
  if (!name || !state.user) return;
  const { doc, setDoc } = window._kfFirebase;
  const db = window._kfDb;
  const appId = window._kfAppId;
  const profileId = crypto.randomUUID();
  await setDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'profiles', profileId), {
    name, avatar: state.createAvatar, myList: [], continueWatching: [], createdAt: Date.now()
  });
  setState({ view: 'profile-picker', createName: '', createAvatar: AVATAR_TEMPLATES[0] });
}

async function deleteProfile(profileId) {
  if (!state.user) return;
  const { doc, deleteDoc } = window._kfFirebase;
  const db = window._kfDb;
  const appId = window._kfAppId;
  await deleteDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'profiles', profileId));
}

async function renameProfile(profileId) {
  const name = state.newProfileName.trim();
  if (!name || !state.user) return;
  const { doc, updateDoc } = window._kfFirebase;
  const db = window._kfDb;
  const appId = window._kfAppId;
  await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'profiles', profileId), { name });
  setState({ editingProfileId: null, newProfileName: '' });
}

async function fetchTMDB() {
  if (state.content.trending.length > 0) return;
  setState({ tmdbLoading: true });
  try {
    const [tR, mR, tvR] = await Promise.all([
      fetch(`${TMDB_BASE}/trending/all/week?api_key=${TMDB_KEY}`),
      fetch(`${TMDB_BASE}/movie/popular?api_key=${TMDB_KEY}`),
      fetch(`${TMDB_BASE}/tv/popular?api_key=${TMDB_KEY}`)
    ]);
    const [tD, mD, tvD] = await Promise.all([tR.json(), mR.json(), tvR.json()]);
    setState({ hero: tD.results[0], content: { trending: tD.results, movies: mD.results, tv: tvD.results }, tmdbLoading: false });
  } catch(e) { setState({ tmdbLoading: false }); }
}

function handleFindMovie() {
  const pool = [...state.content.trending, ...state.content.movies];
  if (!pool.length) return;
  setState({ foundMovie: pool[Math.floor(Math.random() * pool.length)] });
}

    const type = item.media_type || (item.title ? 'movie' : 'tv');
    return `
    <div class="movie-card">
      <img src="${poster}" alt="${title.replace(/"/g,'')}" loading="lazy" />
      <div class="overlay">
        <p style="font-weight:700;font-size:13px;color:#fff;">${title}</p>
        <div style="display:flex;gap:8px;font-size:10px;margin-top:4px;color:#d1d5db;align-items:center;">
          <span style="color:#facc15;">${Icons.star.replace('width="14" height="14"','width="10" height="10"')}</span>
          <span>${rating}</span><span style="text-transform:capitalize;">${type}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderHome() {
  const hero = state.hero;
  const heroTitle = hero ? getTitle(hero) : '';
  const heroRating = hero ? (hero.vote_average?.toFixed(1) || '') : '';
  const heroYear = hero ? ((hero.release_date || hero.first_air_date || '').slice(0,4)) : '';
  const heroOverview = hero ? (hero.overview || '') : '';
  const heroBg = hero ? (getBackdrop(hero) || getPoster(hero) || '') : '';

  const rows = state.tmdbLoading ? `
    <div style="display:flex;align-items:center;justify-content:center;padding:80px 0;">
      <div class="spinner"></div>
    </div>` : `
    <section>
      <h3 style="font-size:20px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
        <span style="color:#facc15;">${Icons.sparkles}</span> Trending This Week
      </h3>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;" class="movie-grid">${renderMovieGrid(state.content.trending)}</div>
    </section>
    <section>
      <h3 style="font-size:20px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
        <span style="color:#ef4444;">${Icons.film}</span> Popular Movies
      </h3>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;" class="movie-grid">${renderMovieGrid(state.content.movies)}</div>
    </section>
    <section>
      <h3 style="font-size:20px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
        <span style="color:#60a5fa;">${Icons.tv}</span> Popular TV Shows
      </h3>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;" class="movie-grid">${renderMovieGrid(state.content.tv)}</div>
    </section>`;

  return `
  ${renderNavbar()}
  <div class="animate-fade-in">
    <section class="hero" style="height:80vh;position:relative;width:100%;">
      ${heroBg ? `<img class="bg" src="${heroBg}" alt="${heroTitle.replace(/"/g,'')}" />` : '<div style="position:absolute;inset:0;background:#18181b;"></div>'}
      <div class="grad1"></div>
      <div class="grad2"></div>
      ${hero ? `
      <div class="hero-content">
        <h2 style="font-size:clamp(40px,7vw,72px);font-weight:900;text-transform:uppercase;letter-spacing:-0.05em;line-height:1;font-style:italic;">${heroTitle}</h2>
        <div style="display:flex;align-items:center;gap:16px;font-size:18px;margin-top:16px;">
          <span style="color:#4ade80;font-weight:700;display:flex;align-items:center;gap:4px;">${Icons.star.replace('width="14" height="14"','width="16" height="16"').replace('currentColor','#4ade80')} ${heroRating}</span>
          <span style="border:1px solid #9ca3af;padding:0 8px;font-size:13px;">HD</span>
          <span>${heroYear}</span>
        </div>
        <p style="font-size:clamp(14px,2vw,18px);color:#e5e7eb;margin-top:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${heroOverview}</p>
        <div style="display:flex;gap:16px;margin-top:24px;">
          <button style="background:#fff;color:#000;padding:12px 32px;border-radius:6px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;transition:background 0.2s;"
            onmouseover="this.style.background='#e5e7eb'" onmouseout="this.style.background='#fff'">
            ${Icons.play.replace('width="20" height="20"','width="24" height="24"')} Play
          </button>
          <button style="background:rgba(107,114,128,0.5);color:#fff;padding:12px 32px;border-radius:6px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;backdrop-filter:blur(4px);transition:background 0.2s;"
            onmouseover="this.style.background='rgba(107,114,128,0.7)'" onmouseout="this.style.background='rgba(107,114,128,0.5)'">
            ${Icons.info.replace('width="20" height="20"','width="24" height="24"')} More Info
          </button>
        </div>
      </div>` : ''}
    </section>
    <div style="padding:0 24px 80px;margin-top:-80px;position:relative;z-index:10;" id="home-rows">
      <div class="space-y-12">${rows}</div>
    </div>
  </div>
  <button onclick="goFinder()"
    style="position:fixed;bottom:24px;right:24px;width:56px;height:56px;background:#dc2626;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,0.5);transition:transform 0.1s;display:none;"
    id="fab-finder"
    onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'">${Icons.sparkles}</button>`;
}

function renderFinder() {
  const fm = state.foundMovie;
  const foundCard = fm ? `
  <div class="finder-card animate-slide-up">
    <div style="display:flex;flex-direction:column;">
      <img src="${getPoster(fm) || ''}" style="width:100%;height:192px;object-fit:cover;" alt="${getTitle(fm).replace(/"/g,'')}" />
      <div style="padding:24px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;flex:1;">
        <div>
          <h3 style="font-size:22px;font-weight:700;margin-bottom:8px;">${getTitle(fm)}</h3>
          <div style="display:flex;gap:12px;font-size:13px;color:#9ca3af;margin-bottom:16px;align-items:center;">
            <span style="color:#4ade80;font-weight:700;display:flex;align-items:center;gap:4px;">${Icons.star.replace('currentColor','#4ade80')} ${fm.vote_average?.toFixed(1)}</span>
            <span>${(fm.release_date||fm.first_air_date||'').slice(0,4)}</span>
            <span style="border:1px solid #4b5563;padding:0 4px;font-size:10px;">HD</span>
          </div>
          <p style="color:#d1d5db;font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;">${fm.overview||''}</p>
        </div>
        <div style="display:flex;gap:12px;margin-top:24px;">
          <button style="flex:1;background:#fff;color:#000;padding:10px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;transition:background 0.2s;"
            onmouseover="this.style.background='#e5e7eb'" onmouseout="this.style.background='#fff'">${Icons.play} Play Now</button>
          <button onclick="handleFindMovie()" style="padding:10px 16px;background:#27272a;border-radius:8px;font-size:14px;font-weight:500;transition:background 0.2s;"
            onmouseover="this.style.background='#3f3f46'" onmouseout="this.style.background='#27272a'">Try Again</button>
        </div>
      </div>
    </div>
  </div>` : '';

  return `
  ${renderNavbar()}
  <div style="min-height:100vh;background:#000;color:#fff;padding-top:96px;padding-left:24px;padding-right:24px;" class="animate-fade-in">
    <div style="max-width:640px;margin:0 auto;text-align:center;">
      <div style="display:flex;justify-content:center;margin-bottom:32px;">
        <div style="width:64px;height:64px;background:#dc2626;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:pulse 2s infinite;">
          ${Icons.sparkles.replace('width="20" height="20"','width="32" height="32"')}
        </div>
      </div>
      <h2 style="font-size:clamp(28px,5vw,48px);font-weight:700;margin-bottom:16px;">Kasenflix Magic Finder</h2>
      <p style="color:#9ca3af;margin-bottom:32px;">Can't decide? We'll pick something from real trending content just for you.</p>
      <button onclick="handleFindMovie()"
        style="width:100%;max-width:320px;background:#dc2626;padding:16px;border-radius:8px;font-weight:700;font-size:18px;transition:background 0.2s;box-shadow:0 10px 30px rgba(220,38,38,0.2);"
        onmouseover="this.style.background='#b91c1c'" onmouseout="this.style.background='#dc2626'">
        FIND ME SOMETHING
      </button>
      ${foundCard}
    </div>
  </div>`;
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const root = document.getElementById('root');
  if (!root) return;

  let html = '';
  switch(state.view) {
    case 'loading':  html = renderLoading(); break;
    case 'auth':     html = renderAuth(); break;
    case 'profile-picker': html = renderProfilePicker(); break;
    case 'manage-profiles': html = renderManageProfiles(); break;
    case 'create-profile': html = renderCreateProfile(); break;
    case 'home':     html = renderHome(); break;
    case 'finder':   html = renderFinder(); break;
    default:         html = renderLoading();
  }

  root.innerHTML = `<div style="background:#000;min-height:100vh;color:#fff;">${html}</div>`;

  // Post-render: fetch TMDB if needed, show nav links on desktop
  if (state.view === 'home' || state.view === 'finder') {
    fetchTMDB();
    const navLinks = document.getElementById('nav-links');
    const profileName = document.getElementById('profile-name');
    const fab = document.getElementById('fab-finder');
    if (navLinks && window.innerWidth >= 768) navLinks.style.display = 'flex';
    if (profileName && window.innerWidth >= 640) profileName.style.display = 'inline';
    if (fab && window.innerWidth < 768) fab.style.display = 'flex';

    // Responsive grids
    const grids = document.querySelectorAll('.movie-grid');
    grids.forEach(g => {
      if (window.innerWidth >= 1024) g.style.gridTemplateColumns = 'repeat(6,1fr)';
      else if (window.innerWidth >= 768) g.style.gridTemplateColumns = 'repeat(5,1fr)';
      else if (window.innerWidth >= 640) g.style.gridTemplateColumns = 'repeat(3,1fr)';
      else g.style.gridTemplateColumns = 'repeat(2,1fr)';
    });
    if (window.innerWidth >= 768) {
      const heroContent = document.querySelector('.hero-content');
      if (heroContent) heroContent.style.left = '48px';
    }
  }

  // Focus create name input
  if (state.view === 'create-profile') {
    setTimeout(() => document.getElementById('create-name-input')?.focus(), 50);
  }

  // Fix edit input focus
  if (state.editingProfileId) {
    setTimeout(() => {
      const inp = document.getElementById(`edit-input-${state.editingProfileId}`);
      if (inp) { inp.focus(); inp.select(); }
    }, 50);
  }
}

// Expose globals
window.setState = setState;
window.handleSignIn = handleSignIn;
window.handleSignUp = handleSignUp;
window.handleGoogleSignIn = handleGoogleSignIn;
window.handleAppleSignIn = handleAppleSignIn;
window.handleSignOut = handleSignOut;
window.createProfile = createProfile;
window.deleteProfile = deleteProfile;
window.renameProfile = renameProfile;
window.handleFindMovie = handleFindMovie;
window.fetchTMDB = fetchTMDB;
window.goFinder = () => { setState({ view: 'finder', foundMovie: null }); fetchTMDB(); };

window.addEventListener('resize', () => {
  if (state.view === 'home' || state.view === 'finder') render();
});

// ============================================================
// BOOT
// ============================================================
setState({ view: 'loading' });
render();
initFirebase();
// Fallback: if Firebase is slow, show auth after 3s
setTimeout(() => {
  if (state.view === 'loading') setState({ view: 'auth' });
}, 3000);
</script>
</body>
</html>
